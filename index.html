<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>輪播製作工具</title>
  <style>
    :root { --bg:#000; --s1:#111; --s2:#1c1c1c; --border:#2a2a2a; --accent:#fff; --blue:#0095f6; }
    *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body{ background:var(--bg); color:var(--accent); font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif; height:100vh; overflow:hidden; }
    .page{ position:fixed; inset:0; display:flex; flex-direction:column; background:var(--bg); transition:transform .25s; }
    .page.off-right{ transform:translateX(100%); }
    .page.off-left{ transform:translateX(-30%); opacity:.5; pointer-events:none; }

    /* Header */
    .hdr{ display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); flex-shrink:0; min-height:52px; }
    .hdr h1{ font-size:16px; font-weight:600; flex:1; text-align:center; }
    .hbtn{ background:none; border:none; color:var(--accent); cursor:pointer; font-size:15px; padding:6px; min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center; }
    .hbtn.lg{ font-size:24px; }
    .hbtn.blue{ color:var(--blue); font-weight:600; }

    /* Gallery */
    #tpl-grid{ flex:1; overflow-y:auto; display:grid; grid-template-columns:1fr 1fr; gap:2px; background:var(--border); }
    .tcard{ background:var(--s1); cursor:pointer; }
    .tcard:active{ opacity:.7; }
    .tcard canvas{ display:block; width:100%; height:auto; }
    .tcard-info{ padding:8px 10px 12px; }
    .tcard-info strong{ display:block; font-size:13px; margin-bottom:3px; }
    .tcard-info span{ font-size:11px; color:#666; }

    /* Editor */
    #editor-scroll{
      flex:1; overflow:auto; background:#111;
      -webkit-overflow-scrolling:touch;
      display:flex; align-items:center; justify-content:center;
    }
    #editor-canvas{ display:block; touch-action:none; flex-shrink:0; }

    /* Export overlay */
    #export-overlay{
      position:fixed; inset:0; background:rgba(0,0,0,.96); z-index:200;
      display:none; flex-direction:column;
    }
    #export-overlay.show{ display:flex; }
    #export-hdr{ display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); flex-shrink:0; }
    #export-hdr h2{ flex:1; text-align:center; font-size:16px; }
    #export-close{ background:none; border:none; color:var(--accent); font-size:22px; cursor:pointer; min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center; }
    #export-tip{ padding:10px 16px 6px; font-size:13px; color:#888; text-align:center; flex-shrink:0; }
    #export-imgs{
      flex:1; overflow-y:auto; display:flex; flex-direction:column;
      gap:16px; padding:16px; -webkit-overflow-scrolling:touch;
      align-items:center;
    }
    .export-item{ width:100%; max-width:400px; }
    .export-item img{ width:100%; display:block; border-radius:6px; }
    .export-label{ font-size:12px; color:#555; text-align:center; margin-top:6px; }

    /* File input */
    #file-input{ display:none; }

    /* Toast */
    #toast{ position:fixed; bottom:40px; left:50%; transform:translateX(-50%) translateY(10px); background:rgba(20,20,20,.92); color:#fff; padding:9px 18px; border-radius:20px; font-size:13px; opacity:0; transition:all .25s; pointer-events:none; z-index:999; white-space:nowrap; max-width:80vw; text-align:center; }
    #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- ── Page: Gallery ── -->
<div id="pg-gallery" class="page">
  <div class="hdr">
    <div style="min-width:44px"></div>
    <h1>選擇模板</h1>
    <div style="min-width:44px"></div>
  </div>
  <div id="tpl-grid"></div>
</div>

<!-- ── Page: Editor ── -->
<div id="pg-editor" class="page off-right">
  <div class="hdr">
    <button class="hbtn lg" onclick="goBack()">‹</button>
    <h1 id="editor-title">編輯</h1>
    <button class="hbtn blue" onclick="saveAll()">儲存</button>
  </div>
  <div id="editor-scroll">
    <canvas id="editor-canvas"></canvas>
  </div>
</div>

<!-- ── Export overlay ── -->
<div id="export-overlay">
  <div id="export-hdr">
    <div style="min-width:44px"></div>
    <h2>長按圖片儲存</h2>
    <button id="export-close" onclick="closeExport()">✕</button>
  </div>
  <div id="export-tip">📱 長按每張圖片 → 儲存到相冊，依序貼到 Facebook</div>
  <div id="export-imgs"></div>
</div>

<input type="file" id="file-input" accept="image/*">
<div id="toast"></div>

<script>
'use strict';

// ── Templates ─────────────────────────────────────────
// slots: x/y/w/h in slide-units (1 unit = 1 slide width/height)
const TPLS = [
  { id:'a1', name:'雙格全景',   slides:2, photos:1,
    slots:[{x:0,y:0,w:2,h:1}] },
  { id:'a2', name:'左大右雙',   slides:2, photos:3,
    slots:[{x:0,y:0,w:1,h:1},{x:1,y:0,w:1,h:.5},{x:1,y:.5,w:1,h:.5}] },
  { id:'a3', name:'三格全景',   slides:3, photos:1,
    slots:[{x:0,y:0,w:3,h:1}] },
  { id:'a4', name:'全景加側',   slides:3, photos:2,
    slots:[{x:0,y:0,w:2,h:1},{x:2,y:0,w:1,h:1}] },
  { id:'a5', name:'側加全景',   slides:3, photos:2,
    slots:[{x:0,y:0,w:1,h:1},{x:1,y:0,w:2,h:1}] },
  { id:'a6', name:'三格並排',   slides:3, photos:3,
    slots:[{x:0,y:0,w:1,h:1},{x:1,y:0,w:1,h:1},{x:2,y:0,w:1,h:1}] },
  { id:'a7', name:'右大左雙',   slides:2, photos:3,
    slots:[{x:0,y:0,w:1,h:.5},{x:0,y:.5,w:1,h:.5},{x:1,y:0,w:1,h:1}] },
  { id:'a8', name:'四格全景',   slides:4, photos:1,
    slots:[{x:0,y:0,w:4,h:1}] },
  { id:'a9', name:'四格並排',   slides:4, photos:4,
    slots:[{x:0,y:0,w:1,h:1},{x:1,y:0,w:1,h:1},{x:2,y:0,w:1,h:1},{x:3,y:0,w:1,h:1}] },
  { id:'b1', name:'側全景側',   slides:4, photos:3,
    slots:[{x:0,y:0,w:1,h:1},{x:1,y:0,w:2,h:1},{x:3,y:0,w:1,h:1}] },
  { id:'b2', name:'四格上下',   slides:2, photos:4,
    slots:[{x:0,y:0,w:1,h:.5},{x:0,y:.5,w:1,h:.5},{x:1,y:0,w:1,h:.5},{x:1,y:.5,w:1,h:.5}] },
  { id:'b3', name:'五格全景',   slides:5, photos:1,
    slots:[{x:0,y:0,w:5,h:1}] },
];

const SLOT_COLORS = ['#1a2535','#251a35','#1a3525','#352520','#25351a','#201a35','#35251a','#1a2535'];

// ── State ─────────────────────────────────────────────
let curTpl = null;
let slotPhotos = [];   // [{img,ox,oy,scale}] or null per slot
let activeSlot = -1;
const LOGICAL_S = 300; // logical pixels per slide (canvas internal resolution)
let viewScale = 1;     // CSS scale of the canvas element
const EXPORT_PX = 1080;

// ── Page navigation ───────────────────────────────────
function goTo(id) {
  const order = ['gallery','editor'];
  const pages = { gallery:'pg-gallery', editor:'pg-editor' };
  const toIdx = order.indexOf(id);
  order.forEach((p, i) => {
    const el = document.getElementById(pages[p]);
    el.classList.remove('off-right','off-left');
    if (i > toIdx) el.classList.add('off-right');
    if (i < toIdx) el.classList.add('off-left');
  });
}
function goBack() { goTo('gallery'); }

// ── Gallery ───────────────────────────────────────────
function buildGallery() {
  const grid = document.getElementById('tpl-grid');
  const cardW = Math.floor((window.innerWidth - 4) / 2);

  TPLS.forEach(tpl => {
    const card = document.createElement('div');
    card.className = 'tcard';
    card.onclick = () => startEditor(tpl);

    const cvs = document.createElement('canvas');
    const th = Math.floor(cardW / tpl.slides);
    cvs.width  = cardW;
    cvs.height = th;
    drawLayout(cvs, tpl, cardW / tpl.slides, false, true);
    card.appendChild(cvs);

    const info = document.createElement('div');
    info.className = 'tcard-info';
    info.innerHTML = `<strong>${tpl.name}</strong><span>📷 ${tpl.photos} 張  🔲 ${tpl.slides} 格</span>`;
    card.appendChild(info);

    grid.appendChild(card);
  });
}

// ── Draw template layout ──────────────────────────────
function drawLayout(canvas, tpl, tileSize, showPlus, gradient) {
  const W = tpl.slides * tileSize, H = tileSize;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#0d0d0d';
  ctx.fillRect(0,0,W,H);

  tpl.slots.forEach((slot, i) => {
    const sx = slot.x * tileSize, sy = slot.y * tileSize;
    const sw = slot.w * tileSize, sh = slot.h * tileSize;
    const gap = Math.max(1.5, tileSize * 0.01);
    const x0=sx+gap, y0=sy+gap, w0=sw-gap*2, h0=sh-gap*2;

    if (gradient) {
      const g = ctx.createLinearGradient(x0,y0,x0+w0,y0+h0);
      const c1=SLOT_COLORS[i*2 % SLOT_COLORS.length], c2=SLOT_COLORS[(i*2+1)%SLOT_COLORS.length];
      g.addColorStop(0,c1); g.addColorStop(1,c2);
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = '#222';
    }
    ctx.fillRect(x0,y0,w0,h0);

    if (showPlus) {
      const cx=sx+sw/2, cy=sy+sh/2, r=Math.min(sw,sh)*0.14;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle='rgba(90,90,90,.85)'; ctx.fill();
      ctx.fillStyle='#fff';
      ctx.font=`bold ${r*1.3}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('+',cx,cy);
    }
  });

  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1;
  for (let i=1; i<tpl.slides; i++) {
    ctx.beginPath(); ctx.moveTo(i*tileSize,0); ctx.lineTo(i*tileSize,H); ctx.stroke();
  }
}

// ── Editor ────────────────────────────────────────────
let evBound = false;

function startEditor(tpl) {
  curTpl = tpl;
  slotPhotos = tpl.slots.map(() => null);
  activeSlot = -1;

  document.getElementById('editor-title').textContent = tpl.name;

  const cvs = document.getElementById('editor-canvas');
  cvs.width  = tpl.slides * LOGICAL_S;
  cvs.height = LOGICAL_S;

  // Initial zoom: fit all slides in editor area
  const scrollEl = document.getElementById('editor-scroll');
  const availW = scrollEl.clientWidth  || window.innerWidth;
  const availH = (scrollEl.clientHeight || window.innerHeight) - 52;
  const scaleW = (availW - 32) / cvs.width;
  const scaleH = (availH - 32) / cvs.height;
  viewScale = Math.min(1, scaleW, scaleH);
  applyViewScale();

  renderEditor();
  if (!evBound) { bindEvents(); evBound = true; }
  goTo('editor');
  showToast('雙指縮放全覽 · 點格子+選照片 · 拖曳/縮放照片');
}

function applyViewScale() {
  const cvs = document.getElementById('editor-canvas');
  cvs.style.width  = (cvs.width  * viewScale) + 'px';
  cvs.style.height = (cvs.height * viewScale) + 'px';
}

// ── Render ────────────────────────────────────────────
function renderEditor() {
  const tpl = curTpl;
  const cvs = document.getElementById('editor-canvas');
  const ctx = cvs.getContext('2d');
  const S = LOGICAL_S;
  const G = 3;

  ctx.fillStyle = '#111';
  ctx.fillRect(0,0,cvs.width,cvs.height);

  tpl.slots.forEach((slot, i) => {
    const sx=slot.x*S, sy=slot.y*S, sw=slot.w*S, sh=slot.h*S;
    const x0=sx+G, y0=sy+G, w0=sw-G*2, h0=sh-G*2;

    ctx.save();
    ctx.beginPath(); ctx.rect(x0,y0,w0,h0); ctx.clip();

    const ph = slotPhotos[i];
    if (ph && ph.img) {
      drawPhoto(ctx, ph.img, sx, sy, sw, sh, ph.ox, ph.oy, ph.scale, G);
    } else {
      ctx.fillStyle = '#1d1d1d'; ctx.fillRect(x0,y0,w0,h0);
      const cx=sx+sw/2, cy=sy+sh/2, r=Math.min(sw,sh)*0.13;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle = i===activeSlot ? '#555':'rgba(70,70,70,.85)'; ctx.fill();
      ctx.fillStyle='#fff';
      ctx.font=`bold ${r*1.5}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('+',cx,cy);
    }
    ctx.restore();

    if (i===activeSlot) {
      ctx.strokeStyle='#0095f6'; ctx.lineWidth=3;
      ctx.strokeRect(x0+1.5,y0+1.5,w0-3,h0-3);
    }
  });

  ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=1;
  for (let i=1; i<tpl.slides; i++) {
    ctx.beginPath(); ctx.moveTo(i*S,0); ctx.lineTo(i*S,S); ctx.stroke();
  }
}

function drawPhoto(ctx, img, slotX, slotY, slotW, slotH, ox, oy, scale, gap) {
  const AR = img.naturalWidth / img.naturalHeight;
  const sAR = slotW / slotH;
  let dw, dh;
  if (AR > sAR) { dh=slotH*scale; dw=dh*AR; }
  else          { dw=slotW*scale; dh=dw/AR; }
  const x = slotX+(slotW-dw)/2+ox;
  const y = slotY+(slotH-dh)/2+oy;
  ctx.drawImage(img,x,y,dw,dh);
}

// ── Events ────────────────────────────────────────────
let drag  = null;   // {x,y,ox,oy} or null
let pinch = null;   // {mode:'photo'|'view', d0, s0|vs0}
let tapInfo = null; // {si, x, y} for tap detection

function bindEvents() {
  const cvs = document.getElementById('editor-canvas');
  const fi  = document.getElementById('file-input');

  fi.addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f || activeSlot < 0) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        slotPhotos[activeSlot] = {img, ox:0, oy:0, scale:1};
        renderEditor();
        showToast('照片已加入 · 拖曳移動 · 雙指縮放');
      };
      img.onerror = () => showToast('圖片載入失敗，請重試');
      img.src = ev.target.result;
    };
    reader.readAsDataURL(f);
    fi.value = '';
  });

  // ── Touch ──
  cvs.addEventListener('touchstart', e => {
    e.preventDefault();
    drag = null; pinch = null; tapInfo = null;

    if (e.touches.length === 1) {
      const pt = getXY(cvs, e.touches[0]);
      const si = hitSlot(pt.x, pt.y);
      if (si < 0) return;

      activeSlot = si;
      renderEditor();
      tapInfo = {si, x: pt.x, y: pt.y};

      if (slotPhotos[si]) {
        // slot with photo → prepare drag (starts on touchstart for responsiveness)
        drag = {x:pt.x, y:pt.y, ox:slotPhotos[si].ox, oy:slotPhotos[si].oy};
      }
      // empty slot: wait for touchend to call fi.click() (iOS requires touchend for file picker)

    } else if (e.touches.length === 2) {
      tapInfo = null; drag = null;
      const d0 = pDist(e.touches);
      const hasPhoto = activeSlot >= 0 && slotPhotos[activeSlot];
      if (hasPhoto) {
        pinch = {mode:'photo', d0, s0: slotPhotos[activeSlot].scale};
      } else {
        pinch = {mode:'view', d0, vs0: viewScale};
      }
    }
  }, {passive:false});

  cvs.addEventListener('touchmove', e => {
    e.preventDefault();
    if (pinch && e.touches.length === 2) {
      const d = pDist(e.touches);
      if (pinch.mode === 'photo' && activeSlot >= 0 && slotPhotos[activeSlot]) {
        slotPhotos[activeSlot].scale = Math.max(.3, Math.min(8, pinch.s0 * d/pinch.d0));
        renderEditor();
      } else if (pinch.mode === 'view') {
        viewScale = Math.max(.15, Math.min(3, pinch.vs0 * d/pinch.d0));
        applyViewScale();
      }
    } else if (drag && e.touches.length === 1 && activeSlot >= 0 && slotPhotos[activeSlot]) {
      const pt = getXY(cvs, e.touches[0]);
      const dx = pt.x - tapInfo?.x, dy = pt.y - tapInfo?.y;
      // If moved more than 6px, it's a drag → cancel tap
      if (tapInfo && Math.sqrt(dx*dx+dy*dy) > 6) tapInfo = null;
      slotPhotos[activeSlot].ox = drag.ox + (pt.x - drag.x);
      slotPhotos[activeSlot].oy = drag.oy + (pt.y - drag.y);
      renderEditor();
    }
  }, {passive:false});

  cvs.addEventListener('touchend', e => {
    if (e.touches.length < 2) pinch = null;
    if (e.touches.length === 0) {
      // Tap on empty slot → open file picker (must be in touchend for iOS)
      if (tapInfo !== null && !slotPhotos[tapInfo.si]) {
        fi.click();
      }
      drag = null;
      tapInfo = null;
    }
  });

  // ── Mouse (desktop) ──
  cvs.addEventListener('mousedown', e => {
    const pt = getXY(cvs, e);
    const si = hitSlot(pt.x, pt.y);
    if (si < 0) return;
    activeSlot = si; renderEditor();
    if (!slotPhotos[si]) { fi.click(); }
    else { drag = {x:pt.x, y:pt.y, ox:slotPhotos[si].ox, oy:slotPhotos[si].oy}; }
  });
  cvs.addEventListener('mousemove', e => {
    if (!drag || activeSlot < 0 || !slotPhotos[activeSlot]) return;
    const pt = getXY(cvs, e);
    slotPhotos[activeSlot].ox = drag.ox + (pt.x - drag.x);
    slotPhotos[activeSlot].oy = drag.oy + (pt.y - drag.y);
    renderEditor();
  });
  cvs.addEventListener('mouseup', () => drag = null);
  cvs.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? .92 : 1.08;
    if (e.ctrlKey || e.metaKey || !(activeSlot >= 0 && slotPhotos[activeSlot])) {
      // zoom canvas view
      viewScale = Math.max(.15, Math.min(3, viewScale * factor));
      applyViewScale();
    } else if (activeSlot >= 0 && slotPhotos[activeSlot]) {
      slotPhotos[activeSlot].scale = Math.max(.3, Math.min(8, slotPhotos[activeSlot].scale * factor));
      renderEditor();
    }
  }, {passive:false});
}

function getXY(cvs, e) {
  const r = cvs.getBoundingClientRect();
  const sc = cvs.width / r.width; // accounts for viewScale
  return { x:(e.clientX-r.left)*sc, y:(e.clientY-r.top)*sc };
}
function hitSlot(x, y) {
  const S = LOGICAL_S;
  return curTpl.slots.findIndex(sl =>
    x >= sl.x*S && x < (sl.x+sl.w)*S && y >= sl.y*S && y < (sl.y+sl.h)*S
  );
}
function pDist(touches) {
  const dx=touches[0].clientX-touches[1].clientX, dy=touches[0].clientY-touches[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}

// ── Export ────────────────────────────────────────────
async function saveAll() {
  const tpl = curTpl;
  if (!slotPhotos.some(p => p && p.img)) { showToast('請先加入至少一張照片'); return; }

  showToast(`正在產生 ${tpl.slides} 張圖片...`);

  const EP = EXPORT_PX;
  const scaleRatio = EP / LOGICAL_S;
  const container = document.getElementById('export-imgs');
  container.innerHTML = '';

  for (let si = 0; si < tpl.slides; si++) {
    const off = document.createElement('canvas');
    off.width = off.height = EP;
    const ctx = off.getContext('2d');
    ctx.fillStyle = '#111'; ctx.fillRect(0,0,EP,EP);

    tpl.slots.forEach((slot, i) => {
      const slotX=slot.x*EP, slotY=slot.y*EP, slotW=slot.w*EP, slotH=slot.h*EP;
      const slideL=si*EP, slideR=slideL+EP;
      const oL=Math.max(slotX,slideL), oR=Math.min(slotX+slotW,slideR);
      if (oL >= oR) return;

      const clipX=oL-slideL, clipW=oR-oL, clipY=slotY, clipH=slotH;
      ctx.save();
      ctx.beginPath(); ctx.rect(clipX,clipY,clipW,clipH); ctx.clip();

      const ph = slotPhotos[i];
      if (ph && ph.img) {
        const img=ph.img;
        const AR=img.naturalWidth/img.naturalHeight, sAR=slotW/slotH;
        let dw,dh;
        if(AR>sAR){dh=slotH*ph.scale;dw=dh*AR;}
        else{dw=slotW*ph.scale;dh=dw/AR;}
        const ox=ph.ox*scaleRatio, oy=ph.oy*scaleRatio;
        const x=slotX-slideL+(slotW-dw)/2+ox;
        const y=slotY+(slotH-dh)/2+oy;
        ctx.drawImage(img,x,y,dw,dh);
      } else {
        ctx.fillStyle='#1d1d1d'; ctx.fillRect(clipX,clipY,clipW,clipH);
      }
      ctx.restore();
    });

    // Add to overlay
    const item = document.createElement('div');
    item.className = 'export-item';
    const imgEl = document.createElement('img');
    imgEl.src = off.toDataURL('image/png');
    imgEl.alt = `第 ${si+1} 格`;
    const label = document.createElement('div');
    label.className = 'export-label';
    label.textContent = `第 ${si+1} 格（共 ${tpl.slides} 格）`;
    item.appendChild(imgEl);
    item.appendChild(label);
    container.appendChild(item);
  }

  document.getElementById('export-overlay').classList.add('show');
}

function closeExport() {
  document.getElementById('export-overlay').classList.remove('show');
}

// ── Toast ─────────────────────────────────────────────
let toastT;
