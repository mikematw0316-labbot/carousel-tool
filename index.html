<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>輪播製作工具</title>
  <style>
    :root { --bg:#000; --s1:#111; --border:#2a2a2a; --accent:#fff; --blue:#0095f6; }
    *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body{ background:var(--bg); color:var(--accent); font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif; height:100vh; overflow:hidden; }
    .page{ position:fixed; inset:0; display:flex; flex-direction:column; background:var(--bg); transition:transform .25s; }
    .page.off-right{ transform:translateX(100%); }
    .page.off-left{ transform:translateX(-30%); opacity:.5; pointer-events:none; }

    .hdr{ display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); flex-shrink:0; min-height:52px; }
    .hdr h1{ font-size:16px; font-weight:600; flex:1; text-align:center; }
    .hbtn{ background:none; border:none; color:var(--accent); cursor:pointer; padding:6px; min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center; font-size:15px; }
    .hbtn.lg{ font-size:24px; }
    .hbtn.blue{ color:var(--blue); font-weight:600; }

    #tpl-grid{ flex:1; overflow-y:auto; display:grid; grid-template-columns:1fr; gap:2px; background:#1a1a1a; padding:0 2px; }
    .cat-hdr{ background:#000; padding:22px 16px 8px; font-size:10px; font-weight:600; color:rgba(255,255,255,.65); letter-spacing:.14em; text-transform:uppercase; }
    .tcard{ background:#111; cursor:pointer; position:relative; overflow:hidden; outline:1px solid rgba(255,255,255,.12); }
    .tcard:active{ opacity:.8; }
    .tcard img{ display:block; pointer-events:none; }
    .tcard-info{ position:absolute; bottom:0; left:0; right:0; padding:36px 14px 12px; background:linear-gradient(transparent,rgba(0,0,0,.92)); display:flex; align-items:flex-end; justify-content:space-between; pointer-events:none; }
    .tcard-name{ font-size:13px; font-weight:600; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.8); }
    .tcard-meta{ font-size:11px; color:rgba(255,255,255,.5); text-shadow:0 1px 3px rgba(0,0,0,.8); }
    #cat-nav{ flex-shrink:0; display:flex; background:#111; border-top:1px solid #1e1e1e; padding:6px 8px; padding-bottom:max(10px,env(safe-area-inset-bottom)); gap:4px; }
    .cat-nav-btn{ flex:1; background:none; border:1px solid #2a2a2a; border-radius:20px; color:rgba(255,255,255,.6); font-size:12px; font-weight:500; padding:7px 4px; cursor:pointer; font-family:inherit; }
    .cat-nav-btn:active{ background:#222; color:#fff; }
    .tcard-scroll{ position:absolute; top:0; left:0; width:100%; height:100%; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; touch-action:pan-x; overscroll-behavior-x:contain; }
    .tcard-scroll::-webkit-scrollbar{ display:none; }
    .tcard-arrow{ position:absolute; right:10px; top:50%; transform:translateY(-50%); background:rgba(0,0,0,.55); color:#fff; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; line-height:1; pointer-events:none; z-index:5; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); transition:opacity .3s; }
    .tcard-scroll.scrolled + .tcard-arrow{ opacity:0; }

    #editor-scroll{ flex:1; overflow:auto; background:#111; -webkit-overflow-scrolling:touch; display:flex; align-items:center; justify-content:flex-start; padding:16px; }
    #editor-canvas{ display:block; touch-action:none; flex-shrink:0; }

    #export-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.96); z-index:200; display:none; flex-direction:column; }
    #export-overlay.show{ display:flex; }
    #export-hdr{ display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); flex-shrink:0; }
    #export-hdr h2{ flex:1; text-align:center; font-size:16px; }
    #export-close{ background:none; border:none; color:var(--accent); font-size:22px; cursor:pointer; min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center; }
    #export-tip{ padding:10px 16px 6px; font-size:13px; color:#777; text-align:center; flex-shrink:0; }
    #export-imgs{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:16px; padding:16px; -webkit-overflow-scrolling:touch; align-items:center; }
    .export-item{ width:100%; max-width:400px; }
    .export-item img{ width:100%; display:block; border-radius:6px; }
    .export-label{ font-size:12px; color:#555; text-align:center; margin-top:6px; }

    #zoom-ctrl{ position:absolute; right:14px; bottom:82px; display:none; flex-direction:column; gap:6px; z-index:50; }
    #zoom-ctrl.show{ display:flex; }
    .zbtn{ width:42px; height:42px; border-radius:50%; background:rgba(18,18,18,.9); border:1px solid rgba(255,255,255,.14); color:#fff; font-size:22px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
    #editor-bottom{ flex-shrink:0; padding:8px 20px; padding-bottom:max(14px,env(safe-area-inset-bottom)); background:#000; display:none; }
    #editor-bottom.show{ display:block; }
    #editor-hint{ color:rgba(255,255,255,.4); font-size:11px; text-align:center; padding:4px 0 10px; pointer-events:none; letter-spacing:.02em; }
    #save-btn{ width:100%; height:50px; border-radius:25px; background:#fff; border:none; color:#000; font-size:16px; font-weight:600; cursor:pointer; }
    #update-btn{ position:fixed; display:none; flex-direction:column; gap:8px; z-index:150; transform:translate(-50%,-50%); align-items:center; pointer-events:none; }
    #update-btn.show{ display:flex; pointer-events:auto; }
    #update-btn button{ background:rgba(10,10,10,.88); border:1px solid rgba(255,255,255,.18); color:#fff; padding:11px 24px; border-radius:24px; font-size:14px; font-weight:500; cursor:pointer; min-height:44px; white-space:nowrap; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
    #update-btn .ubtn-cancel{ font-size:12px; padding:8px 20px; color:rgba(255,255,255,.5); background:rgba(0,0,0,.6); }
    #file-input{ display:none; }
    #toast{ position:fixed; bottom:40px; left:50%; transform:translateX(-50%) translateY(10px); background:rgba(20,20,20,.93); color:#fff; padding:9px 18px; border-radius:20px; font-size:13px; opacity:0; transition:all .25s; pointer-events:none; z-index:999; white-space:nowrap; max-width:82vw; text-align:center; }
    #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div id="pg-gallery" class="page">
  <div class="hdr">
    <div style="min-width:44px"></div>
    <h1>選擇模板</h1>
    <div style="min-width:44px"></div>
  </div>
  <div id="tpl-grid"></div>
  <div id="cat-nav">
    <button class="cat-nav-btn" onclick="scrollToCategory('portrait')">直式</button>
    <button class="cat-nav-btn" onclick="scrollToCategory('grid')">方格</button>
  </div>
</div>

<div id="pg-editor" class="page off-right">
  <div class="hdr">
    <button class="hbtn lg" onclick="goBack()">‹</button>
    <h1 id="editor-title">編輯</h1>
    <div style="min-width:44px"></div>
  </div>
  <div id="editor-scroll">
    <canvas id="editor-canvas"></canvas>
  </div>
  <div id="zoom-ctrl">
    <button class="zbtn" ontouchend="event.preventDefault();zoomEditor(1)" onclick="zoomEditor(1)">+</button>
    <button class="zbtn" ontouchend="event.preventDefault();zoomEditor(-1)" onclick="zoomEditor(-1)">−</button>
  </div>
  <div id="editor-bottom">
    <div id="editor-hint">點格子新增照片 · 右下角 +/− 縮放</div>
    <button id="save-btn" onclick="saveAll()">儲存</button>
  </div>
</div>

<div id="export-overlay">
  <div id="export-hdr">
    <div style="min-width:44px"></div>
    <h2>長按圖片儲存</h2>
    <button id="export-close" onclick="closeExport()">✕</button>
  </div>
  <div id="export-tip">📱 長按每張圖片 → 儲存到相冊，依序貼到 Facebook</div>
  <div id="export-imgs"></div>
</div>

<input type="file" id="file-input" accept="image/*" multiple>
<div id="update-btn">
  <button onclick="replacePhoto()">更換照片</button>
  <button class="ubtn-cancel" onclick="hideUpdateBtn()">取消</button>
</div>
<div id="toast"></div>

<script>
'use strict';

// ── Templates ─────────────────────────────────────────
// Regular slot:  {x, y, w, h}  — top-left origin, clip region, in slide-units
// Overlay slot:  {ov:true, cx, cy, w, h, rot?, frame?, shadow?}
//                cx/cy = center in slide-units; rot = degrees; frame = border % of min dim
const TPLS = [

  // ── 直式版型 (portrait, aspect 4:5 = 1.25) ──
  // Coordinate note: x/w in slide-width units; y/h in slide-HEIGHT units (0–1)
  // Overlay: cx in slide-width units, cy in slide-height units

  { id:'por1', cat:'portrait', name:'雙直全景', slides:2, photos:1, aspect:1.25,
    slots:[{x:0,y:0,w:2,h:1}] },

  // 三格錯位 — alternating up/down
  { id:'por6', cat:'portrait', name:'三直錯位', slides:3, photos:3, aspect:1.25,
    slots:[{x:0,y:0,w:1,h:0.84},{x:1,y:0.16,w:1,h:0.84},{x:2,y:0,w:1,h:0.84}] },

  // 四直全景 — 一圖四格，9:16 比例
  { id:'por4', cat:'portrait', name:'四直全景', slides:4, photos:1, aspect:1.78,
    slots:[{x:0,y:0,w:4,h:1}] },

  // 四格錯位 — 9:16 比例，交替上下錯位
  { id:'por6b', cat:'portrait', name:'四直錯位', slides:4, photos:4, aspect:1.78,
    slots:[{x:0,y:0,w:1,h:0.84},{x:1,y:0.16,w:1,h:0.84},{x:2,y:0,w:1,h:0.84},{x:3,y:0.16,w:1,h:0.84}] },

  // 圖押圖 — two backgrounds, portrait overlay straddling boundary
  { id:'por8', cat:'portrait', name:'雙直押圖', slides:2, photos:3, aspect:1.25,
    slots:[{x:0,y:0,w:1,h:1},{x:1,y:0,w:1,h:1},
           {ov:true,cx:1.0,cy:0.5,w:0.56,h:0.68,rot:-5,frame:1,shadow:true}] },

  // 錯位 + 圖押圖
  { id:'por9', cat:'portrait', name:'錯位押圖', slides:2, photos:3, aspect:1.25,
    slots:[{x:0,y:0,w:1,h:0.84},{x:1,y:0.16,w:1,h:0.84},
           {ov:true,cx:1.0,cy:0.5,w:0.56,h:0.68,rot:5,frame:1,shadow:true}] },

  // 全景底景 + overlay
  { id:'por10', cat:'portrait', name:'底景押圖', slides:2, photos:2, aspect:1.25,
    slots:[{x:0,y:0,w:2,h:1},
           {ov:true,cx:1.0,cy:0.5,w:0.56,h:0.68,rot:3,frame:1,shadow:true}] },

  // 兩背景 + 兩個押圖，對角交叉
  { id:'por11', cat:'portrait', name:'雙押交叉', slides:2, photos:4, aspect:1.25,
    slots:[{x:0,y:0,w:1,h:1},{x:1,y:0,w:1,h:1},
           {ov:true,cx:0.42,cy:0.64,w:0.52,h:0.62,rot:-4,frame:1,shadow:true},
           {ov:true,cx:1.58,cy:0.36,w:0.52,h:0.62,rot:4,frame:1,shadow:true}] },

  // ── 方格版型 (square, aspect 1:1) ──

  { id:'sq4', cat:'grid', name:'三格全景', slides:3, photos:1,
    slots:[{x:0,y:0,w:3,h:1}] },

  // 四張直板並排（4:5比例，每張各自獨立）
  { id:'sq5', cat:'grid', name:'四格直板', slides:4, photos:4, aspect:1.25,
    slots:[{x:0,y:0,w:1,h:1},{x:1,y:0,w:1,h:1},{x:2,y:0,w:1,h:1},{x:3,y:0,w:1,h:1}] },

  // 左大右雙
  { id:'sq7', cat:'grid', name:'左大右雙', slides:2, photos:3,
    slots:[{x:0,y:0,w:1,h:1},{x:1,y:0,w:1,h:0.5},{x:1,y:0.5,w:1,h:0.5}] },

  // 單格 + 押圖
  { id:'sq8', cat:'grid', name:'單格押圖', slides:1, photos:2,
    slots:[{x:0,y:0,w:1,h:1},
           {ov:true,cx:0.5,cy:0.5,w:0.55,h:0.55,rot:-5,frame:1,shadow:true}] },

  // 雙格 + 押圖跨縫
  { id:'sq9', cat:'grid', name:'雙格押圖', slides:2, photos:3,
    slots:[{x:0,y:0,w:1,h:1},{x:1,y:0,w:1,h:1},
           {ov:true,cx:1.0,cy:0.5,w:0.54,h:0.54,rot:5,frame:1,shadow:true}] },

  // 全景底景 + 雙押圖
  { id:'sq10', cat:'grid', name:'底景雙押', slides:2, photos:3,
    slots:[{x:0,y:0,w:2,h:1},
           {ov:true,cx:0.45,cy:0.48,w:0.52,h:0.52,rot:-5,frame:1,shadow:true},
           {ov:true,cx:1.55,cy:0.52,w:0.52,h:0.52,rot:4,frame:1,shadow:true}] },

  // 四格全景 + 三個押圖
  { id:'sq11', cat:'grid', name:'三格三押', slides:3, photos:4,
    slots:[{x:0,y:0,w:3,h:1},
           {ov:true,cx:0.48,cy:0.46,w:0.50,h:0.50,rot:-5,frame:1,shadow:true},
           {ov:true,cx:1.50,cy:0.54,w:0.50,h:0.50,rot:3,frame:1,shadow:true},
           {ov:true,cx:2.52,cy:0.46,w:0.50,h:0.50,rot:-4,frame:1,shadow:true}] },

  // 4格各一張背景 + 第2-3格之間押圖
  { id:'sq12', cat:'grid', name:'四拼押圖', slides:4, photos:5,
    slots:[{x:0,y:0,w:1,h:1},{x:1,y:0,w:1,h:1},{x:2,y:0,w:1,h:1},{x:3,y:0,w:1,h:1},
           {ov:true,cx:2.0,cy:0.5,w:0.52,h:0.52,rot:-4,frame:1,shadow:true}] },
];

// Preview slot colours — muted tones that look good in gallery
const SLOT_COLORS  = ['#4a5260','#60504a','#4a604e','#564a60','#604e4a','#4a5660','#604a50','#504a60'];
// Overlay preview uses warm neutral grays (like real photo paper)
const OV_BG_COLOR  = '#a8a4a0';  // warm gray for photo slots in overlay templates
const OV_FRM_COLOR = '#ffffff';  // pure white Polaroid frame
const CAT_LABELS   = { portrait:'◧ 直式版型', grid:'▦ 方格版型' };

// ── State ─────────────────────────────────────────────
let curTpl = null;
let slotPhotos = [];
let activeSlot = -1;
const LOGICAL_S = 300;
let viewScale = 1;
const EXPORT_PX = 1080;

// ── Sample photos (preloaded for gallery previews) ─────
const SAMPLE_URLS = [
  'photos/p1.jpg','photos/p2.jpg','photos/p3.jpg','photos/p4.jpg',
  'photos/p5.jpg','photos/p6.jpg','photos/p7.jpg','photos/p8.jpg',
];
let sampleImgs = [];  // filled after load

// ── Nav ───────────────────────────────────────────────
function goTo(id) {
  const order = ['gallery','editor'];
  const pages = { gallery:'pg-gallery', editor:'pg-editor' };
  const toIdx = order.indexOf(id);
  order.forEach((p, i) => {
    const el = document.getElementById(pages[p]);
    el.classList.remove('off-right','off-left');
    if (i > toIdx) el.classList.add('off-right');
    if (i < toIdx) el.classList.add('off-left');
  });
}
function goBack() { hideUpdateBtn(); document.getElementById('zoom-ctrl').classList.remove('show'); document.getElementById('editor-bottom').classList.remove('show'); goTo('gallery'); }

// ── Slot helpers ──────────────────────────────────────
function isOv(sl) { return !!sl.ov; }

// ── Gallery ───────────────────────────────────────────
function scrollToCategory(cat) {
  const grid = document.getElementById('tpl-grid');
  const label = CAT_LABELS[cat] || cat;
  const hdrs = grid.querySelectorAll('.cat-hdr');
  for (const hdr of hdrs) {
    if (hdr.textContent.includes(label.replace(/[✦◎◈]/g,'').trim()) || hdr.textContent === label) {
      const gridRect = grid.getBoundingClientRect();
      const hdrRect = hdr.getBoundingClientRect();
      grid.scrollTo({ top: grid.scrollTop + (hdrRect.top - gridRect.top) - 4, behavior: 'smooth' });
      return;
    }
  }
}

function buildGallery() {
  const grid = document.getElementById('tpl-grid');
  grid.innerHTML = '';  // clear if rebuilding
  const screenW = window.innerWidth - 4;
  const MAX_TILE = 260;
  let lastCat = null;

  TPLS.forEach(tpl => {
    if (tpl.cat !== lastCat) {
      lastCat = tpl.cat;
      const hdr = document.createElement('div');
      hdr.className = 'cat-hdr';
      hdr.textContent = CAT_LABELS[tpl.cat] || tpl.cat;
      grid.appendChild(hdr);
    }

    const card = document.createElement('div');
    card.className = 'tcard';
    card.onclick = () => startEditor(tpl);

    // Always fit all slides across screen width — no scrolling
    const tileW = Math.min(Math.floor(screenW / tpl.slides), MAX_TILE);
    let dataURL = '', cardH = tileW;
    try {
      const tempCvs = document.createElement('canvas');
      drawLayout(tempCvs, tpl, tileW, true);
      cardH = Math.round(screenW * tempCvs.height / tempCvs.width);
      dataURL = tempCvs.toDataURL('image/jpeg', 0.88);
      tempCvs.width = tempCvs.height = 0;  // free iOS canvas memory
    } catch(e) {
      console.warn('preview render failed', tpl.id, e);
    }

    card.style.height = cardH + 'px';

    const img = new Image();
    if (dataURL) img.src = dataURL;
    img.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;pointer-events:none;';
    card.appendChild(img);

    const info = document.createElement('div');
    info.className = 'tcard-info';
    info.innerHTML = `<span class="tcard-name">${tpl.name}</span><span class="tcard-meta">${tpl.slides}格 · ${tpl.photos}張</span>`;
    card.appendChild(info);
    grid.appendChild(card);
  });
}

// ── Draw layout (gallery preview) ────────────────────
function drawLayout(canvas, tpl, tileSize, gradient) {
  const aspect = tpl.aspect || 1;
  const W = tpl.slides * tileSize;
  const H = Math.round(tileSize * aspect);
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  // Gap between slots — 3px min so real photos have clear grid lines
  const gap = Math.max(3, tileSize * 0.024);
  // Photo-mood gradients: vivid, photo-like colours per slot
  const PHOTO_MOODS = [
    ['#e8b87a','#a06838'],
    ['#7ab4e0','#3870a8'],
    ['#a8cc80','#587840'],
    ['#f0a878','#a05838'],
    ['#88c0d0','#407888'],
    ['#e0b090','#906050'],
    ['#98cca8','#508060'],
    ['#c8a8d0','#786088'],
  ];

  // Pass 1: regular (background) slots
  // x/w in slide-width units; y/h in slide-height units
  let slotIdx = 0;
  tpl.slots.forEach((sl, i) => {
    if (isOv(sl)) return;
    const sx=sl.x*tileSize, sy=sl.y*H, sw=sl.w*tileSize, sh=sl.h*H;
    const x0=sx+gap, y0=sy+gap, w0=sw-gap*2, h0=sh-gap*2;
    const sImg = sampleImgs[slotIdx % sampleImgs.length];
    slotIdx++;
    if (sImg && sImg.naturalWidth) {
      ctx.save();
      ctx.beginPath(); ctx.rect(x0, y0, w0, h0); ctx.clip();
      const pAR = sImg.naturalWidth / sImg.naturalHeight, sAR = w0 / h0;
      let dw, dh;
      if (pAR > sAR) { dh = h0; dw = dh * pAR; } else { dw = w0; dh = dw / pAR; }
      ctx.drawImage(sImg, x0 + (w0-dw)/2, y0 + (h0-dh)/2, dw, dh);
      ctx.restore();
    } else {
      const mood = PHOTO_MOODS[slotIdx % PHOTO_MOODS.length];
      const g = ctx.createLinearGradient(x0, y0, x0+w0, y0+h0);
      g.addColorStop(0, mood[0]); g.addColorStop(1, mood[1]);
      ctx.fillStyle = g; ctx.fillRect(x0,y0,w0,h0);
    }
  });

  // Slide dividers
  ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = Math.max(2, gap);
  for (let i=1; i<tpl.slides; i++) {
    ctx.beginPath(); ctx.moveTo(i*tileSize,0); ctx.lineTo(i*tileSize,H); ctx.stroke();
  }

  // Pass 2: overlay slots — count regular slots to continue photo index
  const regCount = tpl.slots.filter(s => !isOv(s)).length;
  let ovIdx = regCount;
  tpl.slots.forEach((sl, i) => {
    if (!isOv(sl)) return;
    drawOvPreview(ctx, sl, tileSize, H, sampleImgs[ovIdx % sampleImgs.length] || null);
    ovIdx++;
  });
}

function drawOvPreview(ctx, sl, tileSize, H, sImg) {
  const cx=sl.cx*tileSize, cy=sl.cy*H;
  const w=sl.w*tileSize, h=sl.h*tileSize;
  const rot=(sl.rot||0)*Math.PI/180;
  const fw = sl.frame ? Math.max(1, Math.round(2 * tileSize / LOGICAL_S)) : 0;

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rot);

  if (sl.shadow) {
    ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=8; ctx.shadowOffsetX=2; ctx.shadowOffsetY=3;
  }
  if (fw>0) {
    ctx.fillStyle = OV_FRM_COLOR;
    ctx.fillRect(-w/2,-h/2,w,h);
    ctx.shadowColor='transparent'; ctx.shadowBlur=0;
  }
  const iw=w-fw*2, ih=h-fw*2;
  if (sImg && sImg.naturalWidth) {
    ctx.save();
    ctx.beginPath(); ctx.rect(-iw/2,-ih/2,iw,ih); ctx.clip();
    const pAR = sImg.naturalWidth/sImg.naturalHeight, sAR = iw/ih;
    let dw, dh;
    if (pAR > sAR) { dh=ih; dw=dh*pAR; } else { dw=iw; dh=dw/pAR; }
    ctx.drawImage(sImg, -dw/2, -dh/2, dw, dh);
    ctx.restore();
  } else {
    const og = ctx.createLinearGradient(-iw/2,-ih/2,iw/2,ih/2);
    og.addColorStop(0,'#e0b088'); og.addColorStop(1,'#986048');
    ctx.fillStyle = og;
    ctx.fillRect(-iw/2,-ih/2,iw,ih);
  }
  ctx.restore();
}

// ── Editor ────────────────────────────────────────────
let evBound = false;

function startEditor(tpl) {
  curTpl = tpl;
  slotPhotos = tpl.slots.map(() => null);
  activeSlot = -1;
  document.getElementById('editor-title').textContent = tpl.name;

  const cvs = document.getElementById('editor-canvas');
  cvs.width  = tpl.slides * LOGICAL_S;
  cvs.height = Math.round(LOGICAL_S * (tpl.aspect || 1));

  const scrollEl = document.getElementById('editor-scroll');
  const availW = scrollEl.clientWidth  || window.innerWidth;
  const availH = (scrollEl.clientHeight || window.innerHeight) - 52;
  // Fit all slides on screen so no slot is off-screen / unreachable
  viewScale = Math.min(1, (availW-32)/cvs.width, (availH-32)/cvs.height);
  applyViewScale();

  // Editor scroll bg matches template mood
  document.getElementById('editor-scroll').style.background = tpl.bg ? '#1e1a16' : '#111';

  renderEditor();
  if (!evBound) { bindEvents(); evBound = true; }
  document.getElementById('zoom-ctrl').classList.add('show');
  document.getElementById('editor-bottom').classList.add('show');
  goTo('editor');
}

function zoomEditor(dir) {
  viewScale = Math.max(0.1, Math.min(3, viewScale * (dir > 0 ? 1.3 : 1/1.3)));
  applyViewScale();
}

function applyViewScale() {
  const cvs = document.getElementById('editor-canvas');
  const scroll = document.getElementById('editor-scroll');
  const dw = cvs.width * viewScale, dh = cvs.height * viewScale;
  cvs.style.width = dw+'px'; cvs.style.height = dh+'px';
  // Center if narrower than scroll area, left-align (scrollable) if wider
  const avail = (scroll.clientWidth || window.innerWidth) - 32;
  cvs.style.marginLeft = dw < avail ? ((avail - dw) / 2) + 'px' : '0';
}

// ── Render editor ─────────────────────────────────────
function renderEditor() {
  const tpl = curTpl;
  const cvs = document.getElementById('editor-canvas');
  const ctx = cvs.getContext('2d');
  const S = LOGICAL_S, G = 3;
  const H = Math.round(S * (tpl.aspect || 1));

  const isLightBg = !!tpl.bg;
  ctx.fillStyle = tpl.bg || '#111';
  ctx.fillRect(0,0,cvs.width,cvs.height);

  // Subtle vignette for cream/paper bg in editor
  if (isLightBg) {
    const rg = ctx.createRadialGradient(cvs.width/2,H/2,0, cvs.width/2,H/2,Math.max(cvs.width,H)*0.65);
    rg.addColorStop(0,'rgba(0,0,0,0)');
    rg.addColorStop(1,'rgba(0,0,0,0.07)');
    ctx.fillStyle=rg; ctx.fillRect(0,0,cvs.width,H);
  }

  // Pass 1: regular slots (x/w in slide-width units; y/h in slide-height units)
  tpl.slots.forEach((sl, i) => {
    if (isOv(sl)) return;
    const sx=sl.x*S, sy=sl.y*H, sw=sl.w*S, sh=sl.h*H;
    const x0=sx+G, y0=sy+G, w0=sw-G*2, h0=sh-G*2;
    ctx.save();
    ctx.beginPath(); ctx.rect(x0,y0,w0,h0); ctx.clip();
    const ph=slotPhotos[i];
    if (ph&&ph.img) {
      drawPhotoClip(ctx, ph.img, sx, sy, sw, sh, ph.ox, ph.oy, ph.scale);
    } else {
      ctx.fillStyle='#1d1d1d'; ctx.fillRect(x0,y0,w0,h0);
      drawPlus(ctx, sx+sw/2, sy+sh/2, Math.min(sw,sh)*0.13, i===activeSlot);
    }
    ctx.restore();
    if (i===activeSlot) {
      ctx.strokeStyle='#0095f6'; ctx.lineWidth=3;
      ctx.strokeRect(x0+1.5,y0+1.5,w0-3,h0-3);
    }
    if (i===swapOverSlot) {
      ctx.fillStyle='rgba(255,255,255,.22)';
      ctx.fillRect(x0,y0,w0,h0);
      ctx.strokeStyle='#fff'; ctx.lineWidth=3;
      ctx.strokeRect(x0+1.5,y0+1.5,w0-3,h0-3);
    }
  });

  // Slide dividers
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1;
  for (let i=1; i<tpl.slides; i++) {
    ctx.beginPath(); ctx.moveTo(i*S,0); ctx.lineTo(i*S,H); ctx.stroke();
  }

  // Pass 2: overlay slots (on top)
  tpl.slots.forEach((sl, i) => {
    if (!isOv(sl)) return;
    drawOvSlot(ctx, sl, i, S, H, isLightBg);
  });
}

function drawPlus(ctx, cx, cy, r, active, darkBg=true) {
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle = active ? (darkBg?'#555':'#888') : (darkBg?'rgba(70,70,70,.85)':'rgba(150,150,150,.8)');
  ctx.fill();
  ctx.fillStyle = darkBg ? '#fff' : '#fff';
  ctx.font=`bold ${r*1.5}px sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('+',cx,cy);
}

function drawPhotoClip(ctx, img, slotX, slotY, slotW, slotH, ox, oy, scale) {
  const AR=img.naturalWidth/img.naturalHeight, sAR=slotW/slotH;
  let dw,dh;
  if(AR>sAR){dh=slotH*scale;dw=dh*AR;}else{dw=slotW*scale;dh=dw/AR;}
  ctx.drawImage(img, slotX+(slotW-dw)/2+ox, slotY+(slotH-dh)/2+oy, dw, dh);
}

function drawOvSlot(ctx, sl, i, S, H, lightBg=false) {
  const cx=sl.cx*S, cy=sl.cy*H, w=sl.w*S, h=sl.h*S;
  const rot=(sl.rot||0)*Math.PI/180;
  const fw = sl.frame ? 2 : 0;
  const ph=slotPhotos[i];

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rot);

  if (sl.shadow) {
    ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=14; ctx.shadowOffsetX=3; ctx.shadowOffsetY=4;
  }
  if (fw>0) {
    ctx.fillStyle='#f0f0f0'; ctx.fillRect(-w/2,-h/2,w,h);
    ctx.shadowColor='transparent'; ctx.shadowBlur=0;
  }

  const iw=w-fw*2, ih=h-fw*2;
  ctx.save();
  ctx.beginPath(); ctx.rect(-iw/2,-ih/2,iw,ih); ctx.clip();

  if (ph&&ph.img) {
    const img=ph.img;
    const AR=img.naturalWidth/img.naturalHeight, sAR=iw/ih;
    let dw,dh;
    if(AR>sAR){dh=ih*ph.scale;dw=dh*AR;}else{dw=iw*ph.scale;dh=dw/AR;}
    ctx.drawImage(img, -(dw/2)+ph.ox, -(dh/2)+ph.oy, dw, dh);
  } else {
    // Empty overlay slot: warm gray on light bg, dark gray on dark bg
    ctx.fillStyle = lightBg ? '#c8c3be' : '#2a2a2a';
    ctx.fillRect(-iw/2,-ih/2,iw,ih);
    drawPlus(ctx, 0, 0, Math.min(iw,ih)*0.13, i===activeSlot);
  }
  ctx.restore();

  if (i===activeSlot) {
    ctx.strokeStyle='#0095f6'; ctx.lineWidth=2.5;
    ctx.strokeRect(-iw/2+1,-ih/2+1,iw-2,ih-2);
  }
  ctx.restore();
}

// ── Update button (replace photo) ────────────────────
let updateBtnSlot = -1;
function showUpdateBtn(si) {
  updateBtnSlot = si;
  const sl = curTpl.slots[si];
  const cvs = document.getElementById('editor-canvas');
  const rect = cvs.getBoundingClientRect();
  const S = LOGICAL_S;
  const H = Math.round(S * (curTpl.aspect || 1));
  let bx, by;
  if (isOv(sl)) {
    bx = rect.left + sl.cx * S * viewScale;
    by = rect.top  + sl.cy * H * viewScale;
  } else {
    bx = rect.left + (sl.x + sl.w / 2) * S * viewScale;
    by = rect.top  + (sl.y + sl.h / 2) * H * viewScale;
  }
  const btn = document.getElementById('update-btn');
  btn.style.left = bx + 'px';
  btn.style.top  = by + 'px';
  btn.classList.add('show');
}
function hideUpdateBtn() {
  document.getElementById('update-btn').classList.remove('show');
  updateBtnSlot = -1;
}
function replacePhoto() {
  if (updateBtnSlot < 0) return;
  activeSlot = updateBtnSlot;
  hideUpdateBtn();
  document.getElementById('file-input').click();
}

// ── Hit testing ───────────────────────────────────────
function hitSlot(x, y) {
  const S = LOGICAL_S;
  const H = Math.round(S * (curTpl.aspect || 1));
  // Overlay slots are on top → check in reverse order first
  for (let i=curTpl.slots.length-1; i>=0; i--) {
    const sl=curTpl.slots[i];
    if (!isOv(sl)) continue;
    const cx=sl.cx*S, cy=sl.cy*H, hw=sl.w*S/2, hh=sl.h*S/2;
    const ang=-(sl.rot||0)*Math.PI/180;
    const dx=x-cx, dy=y-cy;
    const lx=dx*Math.cos(ang)-dy*Math.sin(ang);
    const ly=dx*Math.sin(ang)+dy*Math.cos(ang);
    if(Math.abs(lx)<=hw && Math.abs(ly)<=hh) return i;
  }
  // Regular slots
  for (let i=0; i<curTpl.slots.length; i++) {
    const sl=curTpl.slots[i];
    if(isOv(sl)) continue;
    if(x>=sl.x*S && x<(sl.x+sl.w)*S && y>=sl.y*H && y<(sl.y+sl.h)*H) return i;
  }
  return -1;
}

// ── Events ────────────────────────────────────────────
let drag=null, pinch=null, tapInfo=null, swapStartSlot=-1, swapOverSlot=-1;

function bindEvents() {
  const cvs = document.getElementById('editor-canvas');
  const fi  = document.getElementById('file-input');

  fi.addEventListener('change', e => {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    // Fill from activeSlot onwards through all empty slots
    const allIdxs = curTpl.slots.map((_,i)=>i);
    const start = activeSlot >= 0 ? activeSlot : 0;
    const ordered = [...allIdxs.slice(start), ...allIdxs.slice(0, start)];
    const targets = ordered.filter(i => !slotPhotos[i]);
    const toLoad = files.slice(0, targets.length || 1);
    toLoad.forEach((f, idx) => {
      const si = targets[idx] ?? activeSlot;
      if (si < 0) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => { slotPhotos[si]={img,ox:0,oy:0,scale:1}; renderEditor(); };
        img.onerror = () => showToast('圖片載入失敗，請重試');
        img.src = ev.target.result;
      };
      reader.readAsDataURL(f);
    });
    fi.value = '';
    showToast(files.length > 1 ? `已加入 ${toLoad.length} 張照片` : '照片已加入 · 拖曳調整');
  });

  cvs.addEventListener('touchstart', e => {
    e.preventDefault();
    hideUpdateBtn();
    drag=null; pinch=null; tapInfo=null; swapStartSlot=-1; swapOverSlot=-1;
    if (e.touches.length===1) {
      const pt=getXY(cvs,e.touches[0]);
      const si=hitSlot(pt.x,pt.y);
      if(si<0) return;
      activeSlot=si; renderEditor();
      tapInfo={si,x:pt.x,y:pt.y};
      if(slotPhotos[si]) {
        drag={x:pt.x,y:pt.y,ox:slotPhotos[si].ox,oy:slotPhotos[si].oy};
        swapStartSlot=si;
      }
    } else if (e.touches.length===2) {
      tapInfo=null; drag=null;
      const d0=pDist(e.touches);
      const hasPhoto=activeSlot>=0&&slotPhotos[activeSlot];
      pinch = hasPhoto ? {mode:'photo',d0,s0:slotPhotos[activeSlot].scale}
                       : {mode:'view',d0,vs0:viewScale};
    }
  },{passive:false});

  cvs.addEventListener('touchmove', e => {
    e.preventDefault();
    if(pinch&&e.touches.length===2) {
      const d=pDist(e.touches);
      if(pinch.mode==='photo'&&activeSlot>=0&&slotPhotos[activeSlot]) {
        slotPhotos[activeSlot].scale=Math.max(.2,Math.min(8,pinch.s0*d/pinch.d0));
        renderEditor();
      } else if(pinch.mode==='view') {
        viewScale=Math.max(.15,Math.min(3,pinch.vs0*d/pinch.d0));
        applyViewScale();
      }
    } else if(drag&&e.touches.length===1&&activeSlot>=0&&slotPhotos[activeSlot]) {
      const pt=getXY(cvs,e.touches[0]);
      if(tapInfo) {
        const dx=pt.x-tapInfo.x,dy=pt.y-tapInfo.y;
        if(Math.sqrt(dx*dx+dy*dy)>6) tapInfo=null;
      }
      // Track which slot we're hovering over for swap
      const hoverSi=hitSlot(pt.x,pt.y);
      swapOverSlot=(swapStartSlot>=0&&hoverSi>=0&&hoverSi!==swapStartSlot)?hoverSi:-1;
      // Only pan photo if not hovering over a swap target
      if(swapOverSlot<0) {
        slotPhotos[activeSlot].ox=drag.ox+(pt.x-drag.x);
        slotPhotos[activeSlot].oy=drag.oy+(pt.y-drag.y);
      }
      renderEditor();
    }
  },{passive:false});

  cvs.addEventListener('touchend', e => {
    if(e.touches.length<2) pinch=null;
    if(e.touches.length===0) {
      if(tapInfo!==null) {
        if(!slotPhotos[tapInfo.si]) { fi.click(); }
        else { showUpdateBtn(tapInfo.si); }
      } else if(drag!==null && swapStartSlot>=0) {
        // Drag ended — check if released on a different slot → swap
        const t=e.changedTouches[0];
        const pt=getXY(cvs,t);
        const endSlot=hitSlot(pt.x,pt.y);
        if(endSlot>=0 && endSlot!==swapStartSlot) {
          const tmp=slotPhotos[swapStartSlot];
          slotPhotos[swapStartSlot]=slotPhotos[endSlot]||null;
          slotPhotos[endSlot]=tmp;
          showToast('照片已換位置');
        }
      }
      drag=null; tapInfo=null; swapStartSlot=-1; swapOverSlot=-1;
      renderEditor();
    }
  });

  cvs.addEventListener('mousedown', e => {
    const pt=getXY(cvs,e);
    const si=hitSlot(pt.x,pt.y);
    if(si<0) return;
    activeSlot=si; renderEditor();
    if(!slotPhotos[si]) fi.click();
    else drag={x:pt.x,y:pt.y,ox:slotPhotos[si].ox,oy:slotPhotos[si].oy};
  });
  cvs.addEventListener('mousemove', e => {
    if(!drag||activeSlot<0||!slotPhotos[activeSlot]) return;
    const pt=getXY(cvs,e);
    slotPhotos[activeSlot].ox=drag.ox+(pt.x-drag.x);
    slotPhotos[activeSlot].oy=drag.oy+(pt.y-drag.y);
    renderEditor();
  });
  cvs.addEventListener('mouseup',()=>drag=null);
  cvs.addEventListener('wheel', e => {
    e.preventDefault();
    const f=e.deltaY>0?.92:1.08;
    if(e.ctrlKey||e.metaKey||!(activeSlot>=0&&slotPhotos[activeSlot])) {
      viewScale=Math.max(.15,Math.min(3,viewScale*f)); applyViewScale();
    } else {
      slotPhotos[activeSlot].scale=Math.max(.2,Math.min(8,slotPhotos[activeSlot].scale*f));
      renderEditor();
    }
  },{passive:false});
}

function getXY(cvs,e) {
  const r=cvs.getBoundingClientRect(), sc=cvs.width/r.width;
  return {x:(e.clientX-r.left)*sc, y:(e.clientY-r.top)*sc};
}
function pDist(t) {
  const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}

// ── Export ────────────────────────────────────────────
async function saveAll() {
  const tpl=curTpl;
  if(!slotPhotos.some(p=>p&&p.img)){showToast('請先加入至少一張照片');return;}
  showToast(`正在產生 ${tpl.slides} 張圖片...`);

  const EP=EXPORT_PX;
  const EPH=Math.round(EP*(tpl.aspect||1));  // export height
  const ratio=EP/LOGICAL_S;
  const container=document.getElementById('export-imgs');
  container.innerHTML='';

  for(let si=0;si<tpl.slides;si++){
    const off=document.createElement('canvas');
    off.width=EP; off.height=EPH;
    const ctx=off.getContext('2d');
    ctx.fillStyle=tpl.bg||'#111'; ctx.fillRect(0,0,EP,EPH);

    // Pass 1: regular slots (x/w in slide-width units; y/h in slide-height units)
    tpl.slots.forEach((sl,i)=>{
      if(isOv(sl)) return;
      const slotX=sl.x*EP, slotY=sl.y*EPH, slotW=sl.w*EP, slotH=sl.h*EPH;
      const slideL=si*EP;
      const oL=Math.max(slotX,slideL), oR=Math.min(slotX+slotW,slideL+EP);
      if(oL>=oR) return;
      const clipX=oL-slideL, clipW=oR-oL;
      ctx.save();
      ctx.beginPath(); ctx.rect(clipX,slotY,clipW,slotH); ctx.clip();
      const ph=slotPhotos[i];
      if(ph&&ph.img){
        const img=ph.img;
        const AR=img.naturalWidth/img.naturalHeight, sAR=slotW/slotH;
        let dw,dh;
        if(AR>sAR){dh=slotH*ph.scale;dw=dh*AR;}else{dw=slotW*ph.scale;dh=dw/AR;}
        const ox=ph.ox*ratio, oy=ph.oy*ratio;
        ctx.drawImage(img, slotX-slideL+(slotW-dw)/2+ox, slotY+(slotH-dh)/2+oy, dw, dh);
      } else {
        ctx.fillStyle='#1d1d1d'; ctx.fillRect(clipX,slotY,clipW,slotH);
      }
      ctx.restore();
    });

    // Pass 2: overlay slots (cx in width units, cy in height units)
    tpl.slots.forEach((sl,i)=>{
      if(!isOv(sl)) return;
      const cx=(sl.cx-si)*EP, cy=sl.cy*EPH;
      const w=sl.w*EP, h=sl.h*EP;
      const rot=(sl.rot||0)*Math.PI/180;
      const fw=sl.frame ? Math.round(2*EP/LOGICAL_S) : 0;
      const ph=slotPhotos[i];

      ctx.save();
      ctx.translate(cx,cy); ctx.rotate(rot);

      if(sl.shadow){
        ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=28; ctx.shadowOffsetX=6; ctx.shadowOffsetY=8;
      }
      if(fw>0){
        ctx.fillStyle='#f0f0f0'; ctx.fillRect(-w/2,-h/2,w,h);
        ctx.shadowColor='transparent'; ctx.shadowBlur=0;
      }
      const iw=w-fw*2, ih=h-fw*2;
      ctx.save();
      ctx.beginPath(); ctx.rect(-iw/2,-ih/2,iw,ih); ctx.clip();
      if(ph&&ph.img){
        const img=ph.img;
        const AR=img.naturalWidth/img.naturalHeight, sAR=iw/ih;
        let dw,dh;
        if(AR>sAR){dh=ih*ph.scale;dw=dh*AR;}else{dw=iw*ph.scale;dh=dw/AR;}
        const ox=ph.ox*ratio, oy=ph.oy*ratio;
        ctx.drawImage(img, -(dw/2)+ox, -(dh/2)+oy, dw, dh);
      } else {
        ctx.fillStyle='#2a2a2a'; ctx.fillRect(-iw/2,-ih/2,iw,ih);
      }
      ctx.restore(); ctx.restore();
    });

    const item=document.createElement('div');
    item.className='export-item';
    const imgEl=document.createElement('img');
    imgEl.src=off.toDataURL('image/png');
    imgEl.alt=`第 ${si+1} 格`;
    const label=document.createElement('div');
    label.className='export-label';
    label.textContent=`第 ${si+1} 格（共 ${tpl.slides} 格）`;
    item.appendChild(imgEl); item.appendChild(label);
    container.appendChild(item);
    off.width=off.height=0;  // free iOS canvas memory
  }
  document.getElementById('export-overlay').classList.add('show');
}

function closeExport(){
  document.getElementById('export-overlay').classList.remove('show');
}

// ── Toast ─────────────────────────────────────────────
let toastT;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),3000);
}

// Prevent iOS Safari pinch-zoom from interfering with editor
document.addEventListener('gesturestart',  e => e.preventDefault(), {passive:false});
document.addEventListener('gesturechange', e => e.preventDefault(), {passive:false});

// Preload sample photos, then build gallery (fallback to gradients if load fails)
goTo('gallery');
let loadedCount = 0;
SAMPLE_URLS.forEach((url, i) => {
  const img = new Image();
  img.onload = () => {
    sampleImgs[i] = img;
    loadedCount++;
    if (loadedCount === SAMPLE_URLS.length) buildGallery();
  };
  img.onerror = () => {
    loadedCount++;
    if (loadedCount === SAMPLE_URLS.length) buildGallery();
  };
  img.src = url;
});
