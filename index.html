<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>輪播製作工具</title>
  <style>
    :root { --bg:#000; --s1:#111; --s2:#1c1c1c; --border:#2a2a2a; --accent:#fff; --blue:#0095f6; }
    *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body{ background:var(--bg); color:var(--accent); font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif; height:100vh; overflow:hidden; }
    .page{ position:fixed; inset:0; display:flex; flex-direction:column; background:var(--bg); transition:transform .25s; }
    .page.off-right{ transform:translateX(100%); }
    .page.off-left{ transform:translateX(-30%); opacity:.5; pointer-events:none; }

    /* Header */
    .hdr{ display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); flex-shrink:0; min-height:52px; }
    .hdr h1{ font-size:16px; font-weight:600; flex:1; text-align:center; }
    .hbtn{ background:none; border:none; color:var(--accent); cursor:pointer; font-size:15px; padding:6px; min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center; }
    .hbtn.lg{ font-size:24px; }
    .hbtn.blue{ color:var(--blue); font-weight:600; }

    /* Gallery */
    #tpl-grid{ flex:1; overflow-y:auto; display:grid; grid-template-columns:1fr 1fr; gap:2px; background:var(--border); }
    .tcard{ background:var(--s1); cursor:pointer; active-transform:scale(.97); }
    .tcard canvas{ display:block; width:100%; height:auto; }
    .tcard-info{ padding:8px 10px 12px; }
    .tcard-info strong{ display:block; font-size:13px; margin-bottom:3px; }
    .tcard-info span{ font-size:11px; color:#666; }

    /* Detail */
    #detail-scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    #detail-cvs-wrap{ background:#0a0a0a; padding:24px 16px; display:flex; flex-direction:column; align-items:center; gap:10px; }
    #detail-cvs-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
    #detail-dots{ display:flex; gap:5px; }
    .dot{ width:6px; height:6px; border-radius:50%; background:#333; }
    .dot.on{ background:#fff; }
    #detail-meta{ padding:16px; border-bottom:1px solid var(--border); }
    #detail-meta h2{ font-size:16px; margin-bottom:4px; }
    #detail-meta p{ font-size:13px; color:#666; }
    #detail-btns{ display:flex; justify-content:flex-end; gap:16px; padding:14px 16px; border-bottom:1px solid var(--border); }
    #detail-btns button{ background:none; border:none; font-size:22px; color:#555; cursor:pointer; padding:4px; }
    #btn-use{ margin:16px; padding:16px; background:#fff; color:#000; border:none; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; display:block; width:calc(100% - 32px); }
    #btn-use:active{ background:#ddd; }

    /* Editor */
    #editor-scroll{ flex:1; overflow:auto; background:#111; display:flex; align-items:center; padding:20px; -webkit-overflow-scrolling:touch; }
    #editor-canvas{ display:block; touch-action:none; }
    #editor-bar{ background:var(--s1); border-top:1px solid var(--border); padding:8px 0 env(safe-area-inset-bottom,8px); display:flex; justify-content:space-around; align-items:center; flex-shrink:0; }
    .bbar-btn{ display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:#555; cursor:pointer; font-size:10px; padding:6px 12px; }
    .bbar-btn .ico{ font-size:20px; color:#aaa; }
    #bbar-add{ background:#fff; color:#000; border-radius:50%; width:52px; height:52px; font-size:30px; border:none; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:300; }

    /* File input */
    #file-input{ display:none; }

    /* Toast */
    #toast{ position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(10px); background:rgba(0,0,0,.88); color:#fff; padding:9px 18px; border-radius:20px; font-size:13px; opacity:0; transition:all .25s; pointer-events:none; z-index:999; white-space:nowrap; max-width:80vw; text-align:center; }
    #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- ── Page: Gallery ── -->
<div id="pg-gallery" class="page">
  <div class="hdr">
    <div style="min-width:44px"></div>
    <h1>選擇模板</h1>
    <div style="min-width:44px"></div>
  </div>
  <div id="tpl-grid"></div>
</div>

<!-- ── Page: Detail ── -->
<div id="pg-detail" class="page off-right">
  <div class="hdr">
    <button class="hbtn lg" onclick="goBack('gallery')">‹</button>
    <h1>模板預覽</h1>
    <div style="min-width:44px"></div>
  </div>
  <div id="detail-scroll">
    <div id="detail-cvs-wrap">
      <div id="detail-cvs-scroll"><canvas id="detail-canvas"></canvas></div>
      <div id="detail-dots"></div>
    </div>
    <div id="detail-meta">
      <h2 id="d-name">—</h2>
      <p id="d-desc">—</p>
    </div>
    <div id="detail-btns">
      <button title="分享" onclick="showToast('分享功能即將推出')">⬆</button>
      <button title="收藏" onclick="showToast('收藏功能即將推出')">🔖</button>
    </div>
    <button id="btn-use" onclick="startEditor()">使用模板</button>
  </div>
</div>

<!-- ── Page: Editor ── -->
<div id="pg-editor" class="page off-right">
  <div class="hdr">
    <button class="hbtn lg" onclick="goBack('detail')">‹</button>
    <h1 id="editor-title">編輯</h1>
    <button class="hbtn blue" onclick="saveAll()">儲存</button>
  </div>
  <div id="editor-scroll">
    <canvas id="editor-canvas"></canvas>
  </div>
  <div id="editor-bar">
    <button class="bbar-btn" onclick="showToast('即將推出')"><span class="ico">⬤</span>背景</button>
    <button class="bbar-btn" onclick="showToast('即將推出')"><span class="ico">⧉</span>圖層</button>
    <button id="bbar-add" onclick="addToActive()">+</button>
    <button class="bbar-btn" onclick="showToast('即將推出')"><span class="ico">▣</span>比例</button>
    <button class="bbar-btn" onclick="showToast('即將推出')"><span class="ico">🎞</span>幻燈片</button>
  </div>
</div>

<input type="file" id="file-input" accept="image/*">
<div id="toast"></div>

<script>
'use strict';

// ── Templates ─────────────────────────────────────────
// slots: x/y/w/h in slide-units (1 unit = 1 slide width/height)
const TPLS = [
  { id:'a1', name:'雙格全景',   slides:2, photos:1,
    slots:[{x:0,y:0,w:2,h:1}] },
  { id:'a2', name:'左大右雙',   slides:2, photos:3,
    slots:[{x:0,y:0,w:1,h:1},{x:1,y:0,w:1,h:.5},{x:1,y:.5,w:1,h:.5}] },
  { id:'a3', name:'三格全景',   slides:3, photos:1,
    slots:[{x:0,y:0,w:3,h:1}] },
  { id:'a4', name:'全景加側',   slides:3, photos:2,
    slots:[{x:0,y:0,w:2,h:1},{x:2,y:0,w:1,h:1}] },
  { id:'a5', name:'側加全景',   slides:3, photos:2,
    slots:[{x:0,y:0,w:1,h:1},{x:1,y:0,w:2,h:1}] },
  { id:'a6', name:'三格並排',   slides:3, photos:3,
    slots:[{x:0,y:0,w:1,h:1},{x:1,y:0,w:1,h:1},{x:2,y:0,w:1,h:1}] },
  { id:'a7', name:'右大左雙',   slides:2, photos:3,
    slots:[{x:0,y:0,w:1,h:.5},{x:0,y:.5,w:1,h:.5},{x:1,y:0,w:1,h:1}] },
  { id:'a8', name:'四格全景',   slides:4, photos:1,
    slots:[{x:0,y:0,w:4,h:1}] },
  { id:'a9', name:'四格並排',   slides:4, photos:4,
    slots:[{x:0,y:0,w:1,h:1},{x:1,y:0,w:1,h:1},{x:2,y:0,w:1,h:1},{x:3,y:0,w:1,h:1}] },
  { id:'b1', name:'側全景側',   slides:4, photos:3,
    slots:[{x:0,y:0,w:1,h:1},{x:1,y:0,w:2,h:1},{x:3,y:0,w:1,h:1}] },
  { id:'b2', name:'四格上下',   slides:2, photos:4,
    slots:[{x:0,y:0,w:1,h:.5},{x:0,y:.5,w:1,h:.5},{x:1,y:0,w:1,h:.5},{x:1,y:.5,w:1,h:.5}] },
  { id:'b3', name:'五格全景',   slides:5, photos:1,
    slots:[{x:0,y:0,w:5,h:1}] },
];

const SLOT_COLORS = ['#1a2535','#251a35','#1a3525','#352520','#25351a','#201a35','#35251a','#1a2535'];

// ── State ─────────────────────────────────────────────
let curTpl = null;
let slotPhotos = [];   // [{img,ox,oy,scale}] or null
let activeSlot = -1;
const EXPORT_PX = 1080;
let S = 280;  // display slide size (px), set per screen

// ── Page navigation ───────────────────────────────────
function goTo(id) {
  const order = ['gallery','detail','editor'];
  const pages = { gallery:'pg-gallery', detail:'pg-detail', editor:'pg-editor' };
  const toIdx = order.indexOf(id);
  order.forEach((p, i) => {
    const el = document.getElementById(pages[p]);
    el.classList.remove('off-right','off-left');
    if (i > toIdx) el.classList.add('off-right');
    if (i < toIdx) el.classList.add('off-left');
  });
}
function goBack(id) { goTo(id); }

// ── Gallery ───────────────────────────────────────────
function buildGallery() {
  const grid = document.getElementById('tpl-grid');
  const cardW = Math.floor((window.innerWidth - 4) / 2);

  TPLS.forEach(tpl => {
    const card = document.createElement('div');
    card.className = 'tcard';
    card.onclick = () => openDetail(tpl);

    const cvs = document.createElement('canvas');
    const th = Math.floor(cardW / tpl.slides); // tile height = tile width
    cvs.width  = cardW;
    cvs.height = th;
    drawLayout(cvs, tpl, cardW / tpl.slides, false, true);
    card.appendChild(cvs);

    const info = document.createElement('div');
    info.className = 'tcard-info';
    info.innerHTML = `<strong>${tpl.name}</strong><span>📷 ${tpl.photos} 張  🔲 ${tpl.slides} 格</span>`;
    card.appendChild(info);

    grid.appendChild(card);
  });
}

// ── Draw template layout ──────────────────────────────
function drawLayout(canvas, tpl, tileSize, showPlus, gradient) {
  const W = tpl.slides * tileSize, H = tileSize;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#0d0d0d';
  ctx.fillRect(0,0,W,H);

  tpl.slots.forEach((slot, i) => {
    const sx = slot.x * tileSize, sy = slot.y * tileSize;
    const sw = slot.w * tileSize, sh = slot.h * tileSize;
    const gap = Math.max(1.5, tileSize * 0.01);

    const x0 = sx + gap, y0 = sy + gap, w0 = sw - gap*2, h0 = sh - gap*2;

    if (gradient) {
      const g = ctx.createLinearGradient(x0, y0, x0+w0, y0+h0);
      const [c1,c2] = [SLOT_COLORS[i*2 % SLOT_COLORS.length], SLOT_COLORS[(i*2+1) % SLOT_COLORS.length]];
      g.addColorStop(0, c1); g.addColorStop(1, c2);
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = '#222';
    }
    ctx.fillRect(x0, y0, w0, h0);

    if (showPlus) {
      const cx = sx + sw/2, cy = sy + sh/2;
      const r = Math.min(sw,sh) * 0.14;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle = 'rgba(90,90,90,.85)'; ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${r*1.3}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('+', cx, cy);
    }
  });

  // Slide dividers
  ctx.strokeStyle = 'rgba(255,255,255,.12)';
  ctx.lineWidth = 1;
  for (let i=1; i<tpl.slides; i++) {
    ctx.beginPath();
    ctx.moveTo(i*tileSize, 0); ctx.lineTo(i*tileSize, H);
    ctx.stroke();
  }
}

// ── Detail ────────────────────────────────────────────
function openDetail(tpl) {
  curTpl = tpl;
  document.getElementById('d-name').textContent = tpl.name;
  document.getElementById('d-desc').textContent =
    `直向  📷 ${tpl.photos} 張照片  🔲 ${tpl.slides} 格`;

  // Preview canvas
  const maxW = Math.min(window.innerWidth - 32, 400);
  const ts = Math.min(Math.floor(maxW / tpl.slides), 180);
  const cvs = document.getElementById('detail-canvas');
  drawLayout(cvs, tpl, ts, false, true);

  // Dots
  const dots = document.getElementById('detail-dots');
  dots.innerHTML = '';
  for (let i=0; i<tpl.slides; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i===0 ? ' on':'');
    dots.appendChild(d);
  }

  goTo('detail');
}

// ── Editor ────────────────────────────────────────────
let evBound = false;

function startEditor() {
  if (!curTpl) return;
  slotPhotos = curTpl.slots.map(() => null);
  activeSlot = -1;

  document.getElementById('editor-title').textContent = curTpl.name;

  // Compute display size: try to fit 1.2 slides in viewport width
  const vw = window.innerWidth - 40;
  S = Math.min(Math.floor(vw * 0.88), 320);

  const cvs = document.getElementById('editor-canvas');
  cvs.width  = curTpl.slides * S;
  cvs.height = S;

  renderEditor();
  if (!evBound) { bindEvents(); evBound = true; }
  goTo('editor');
}

// ── Render ────────────────────────────────────────────
function renderEditor() {
  const tpl = curTpl;
  const cvs = document.getElementById('editor-canvas');
  const ctx = cvs.getContext('2d');
  const G = 3; // gap between slots

  ctx.fillStyle = '#111';
  ctx.fillRect(0,0,cvs.width,cvs.height);

  tpl.slots.forEach((slot, i) => {
    const sx = slot.x*S, sy = slot.y*S, sw = slot.w*S, sh = slot.h*S;
    const x0=sx+G, y0=sy+G, w0=sw-G*2, h0=sh-G*2;

    ctx.save();
    ctx.beginPath(); ctx.rect(x0,y0,w0,h0); ctx.clip();

    const ph = slotPhotos[i];
    if (ph && ph.img) {
      drawPhoto(ctx, ph.img, sx, sy, sw, sh, ph.ox, ph.oy, ph.scale, G);
    } else {
      ctx.fillStyle = '#1d1d1d'; ctx.fillRect(x0,y0,w0,h0);
      // Plus circle
      const cx=sx+sw/2, cy=sy+sh/2, r=Math.min(sw,sh)*0.13;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle = i===activeSlot ? '#444':'rgba(80,80,80,.8)'; ctx.fill();
      ctx.fillStyle='#fff';
      ctx.font=`bold ${r*1.4}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('+',cx,cy);
    }
    ctx.restore();

    // Active highlight
    if (i===activeSlot) {
      ctx.strokeStyle='#0095f6'; ctx.lineWidth=2;
      ctx.strokeRect(x0+1,y0+1,w0-2,h0-2);
    }
  });

  // Slide dividers
  ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=1;
  for (let i=1; i<tpl.slides; i++) {
    ctx.beginPath(); ctx.moveTo(i*S,0); ctx.lineTo(i*S,S); ctx.stroke();
  }
}

function drawPhoto(ctx, img, slotX, slotY, slotW, slotH, ox, oy, scale, gap) {
  const AR = img.naturalWidth / img.naturalHeight;
  const sAR = slotW / slotH;
  let dw, dh;
  if (AR > sAR) { dh=slotH*scale; dw=dh*AR; }
  else           { dw=slotW*scale; dh=dw/AR; }
  const x = slotX + (slotW-dw)/2 + ox;
  const y = slotY + (slotH-dh)/2 + oy;
  ctx.drawImage(img, x, y, dw, dh);
}

// ── Events ────────────────────────────────────────────
let drag = null;
let pinch = null;

function bindEvents() {
  const cvs = document.getElementById('editor-canvas');
  const fi  = document.getElementById('file-input');

  // File selected
  fi.addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f || activeSlot<0) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        slotPhotos[activeSlot] = {img, ox:0, oy:0, scale:1};
        renderEditor();
        showToast('照片已加入 · 拖曳移動 · 雙指縮放');
      };
      img.onerror = () => showToast('圖片載入失敗');
      img.src = ev.target.result;
    };
    reader.readAsDataURL(f);
    fi.value = '';
  });

  // Touch
  cvs.addEventListener('touchstart', e => {
    e.preventDefault();
    if (e.touches.length===1) {
      const pt = getXY(cvs, e.touches[0]);
      const si = hitSlot(pt.x, pt.y);
      if (si<0) return;
      activeSlot = si;
      renderEditor();
      if (!slotPhotos[si]) {
        fi.click();
      } else {
        drag = {x:pt.x, y:pt.y, ox:slotPhotos[si].ox, oy:slotPhotos[si].oy};
      }
    } else if (e.touches.length===2) {
      drag = null;
      const d = pDist(e.touches);
      const sc = activeSlot>=0 && slotPhotos[activeSlot] ? slotPhotos[activeSlot].scale : 1;
      pinch = {d0:d, s0:sc};
    }
  }, {passive:false});

  cvs.addEventListener('touchmove', e => {
    e.preventDefault();
    if (pinch && e.touches.length===2) {
      const d = pDist(e.touches);
      const sc = Math.max(.3, Math.min(6, pinch.s0 * d/pinch.d0));
      if (activeSlot>=0 && slotPhotos[activeSlot]) { slotPhotos[activeSlot].scale=sc; renderEditor(); }
    } else if (drag && e.touches.length===1) {
      const pt = getXY(cvs, e.touches[0]);
      slotPhotos[activeSlot].ox = drag.ox + (pt.x-drag.x);
      slotPhotos[activeSlot].oy = drag.oy + (pt.y-drag.y);
      renderEditor();
    }
  }, {passive:false});

  cvs.addEventListener('touchend', () => { drag=null; pinch=null; });

  // Mouse (desktop)
  cvs.addEventListener('mousedown', e => {
    const pt = getXY(cvs, e);
    const si = hitSlot(pt.x, pt.y);
    if (si<0) return;
    activeSlot = si; renderEditor();
    if (!slotPhotos[si]) { fi.click(); }
    else { drag = {x:pt.x, y:pt.y, ox:slotPhotos[si].ox, oy:slotPhotos[si].oy}; }
  });
  cvs.addEventListener('mousemove', e => {
    if (!drag || activeSlot<0 || !slotPhotos[activeSlot]) return;
    const pt = getXY(cvs, e);
    slotPhotos[activeSlot].ox = drag.ox + (pt.x-drag.x);
    slotPhotos[activeSlot].oy = drag.oy + (pt.y-drag.y);
    renderEditor();
  });
  cvs.addEventListener('mouseup', () => drag=null);
  cvs.addEventListener('wheel', e => {
    e.preventDefault();
    if (activeSlot<0||!slotPhotos[activeSlot]) return;
    slotPhotos[activeSlot].scale = Math.max(.3, Math.min(6, slotPhotos[activeSlot].scale * (e.deltaY>0?.92:1.08)));
    renderEditor();
  }, {passive:false});
}

function getXY(cvs, e) {
  const r = cvs.getBoundingClientRect();
  const sc = cvs.width / r.width;
  return { x:(e.clientX-r.left)*sc, y:(e.clientY-r.top)*sc };
}
function hitSlot(x,y) {
  return curTpl.slots.findIndex(sl => x>=sl.x*S && x<(sl.x+sl.w)*S && y>=sl.y*S && y<(sl.y+sl.h)*S);
}
function pDist(touches) {
  const dx=touches[0].clientX-touches[1].clientX, dy=touches[0].clientY-touches[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}

function addToActive() {
  if (activeSlot<0) { showToast('請先點擊要加入照片的區格'); return; }
  document.getElementById('file-input').click();
}

// ── Export ────────────────────────────────────────────
async function saveAll() {
  const tpl = curTpl;
  if (!slotPhotos.some(p=>p&&p.img)) { showToast('請先加入至少一張照片'); return; }
  showToast(`正在匯出 ${tpl.slides} 張...`);

  const EP = EXPORT_PX;
  const scale = EP / S;  // export : display ratio

  for (let si=0; si<tpl.slides; si++) {
    const off = document.createElement('canvas');
    off.width = off.height = EP;
    const ctx = off.getContext('2d');

    ctx.fillStyle='#111'; ctx.fillRect(0,0,EP,EP);

    tpl.slots.forEach((slot,i) => {
      const slotX=slot.x*EP, slotY=slot.y*EP, slotW=slot.w*EP, slotH=slot.h*EP;
      const slideL=si*EP, slideR=slideL+EP;
      const oL=Math.max(slotX,slideL), oR=Math.min(slotX+slotW,slideR);
      if (oL>=oR) return;

      const clipX=oL-slideL, clipW=oR-oL, clipY=slotY, clipH=slotH;

      ctx.save();
      ctx.beginPath(); ctx.rect(clipX,clipY,clipW,clipH); ctx.clip();

      const ph = slotPhotos[i];
      if (ph&&ph.img) {
        const img=ph.img;
        const AR=img.naturalWidth/img.naturalHeight, sAR=slotW/slotH;
        let dw,dh;
        if(AR>sAR){dh=slotH*ph.scale;dw=dh*AR;}
        else{dw=slotW*ph.scale;dh=dw/AR;}
        const ox = ph.ox*scale, oy = ph.oy*scale;
        const x = slotX-slideL+(slotW-dw)/2+ox;
        const y = slotY+(slotH-dh)/2+oy;
        ctx.drawImage(img,x,y,dw,dh);
      } else {
        ctx.fillStyle='#1d1d1d'; ctx.fillRect(clipX,clipY,clipW,clipH);
      }
      ctx.restore();
    });

    // Download this slide
    await new Promise(res => {
      off.toBlob(blob => {
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download=`第${String(si+1).padStart(2,'0')}格.png`;
        a.click();
        setTimeout(()=>{URL.revokeObjectURL(a.href);res();},300);
      },'image/png');
    });
    await new Promise(r=>setTimeout(r,350));
  }

  showToast(`✅ 已下載 ${tpl.slides} 張，請按順序貼到 Facebook`);
}

// ── Toast ─────────────────────────────────────────────
let toastT;
function showToast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),3000);
}

// ── Init ──────────────────────────────────────────────
buildGallery();
goTo('gallery');
</script>
