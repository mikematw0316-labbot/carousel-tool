<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>無縫輪播製作工具</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'Microsoft JhengHei', 'PingFang TC', sans-serif;
      background: #f0f2f5;
      color: #1c1e21;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    #header {
      background: #1877f2;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    #header h1 { font-size: 15px; font-weight: 700; flex: 1; letter-spacing: 0.3px; }

    .slide-counter {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.15);
      padding: 5px 12px;
      border-radius: 20px;
    }
    .slide-counter label { font-size: 12px; opacity: 0.85; }
    .count-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .count-btn:hover { background: rgba(255,255,255,0.35); }
    #slide-num { font-size: 20px; font-weight: 700; min-width: 28px; text-align: center; }

    #btn-export {
      background: white;
      color: #1877f2;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #btn-export:hover { background: #e7f0ff; }

    /* ── Toolbar ── */
    #toolbar {
      background: white;
      padding: 8px 20px;
      display: flex;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid #dde1e7;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .tool-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border: 1px solid #dde1e7;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #1c1e21;
      transition: all 0.15s;
    }
    .tool-btn:hover { background: #f0f2f5; border-color: #c4c8d0; }
    .tool-btn.blue { background: #1877f2; color: white; border-color: #1877f2; }
    .tool-btn.blue:hover { background: #166fe5; }
    .tool-btn.soon { opacity: 0.55; cursor: default; }
    .badge {
      font-size: 10px;
      background: #e4e6eb;
      color: #606770;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 600;
    }
    .divider { width: 1px; height: 28px; background: #dde1e7; margin: 0 2px; }

    /* ── Canvas area ── */
    #canvas-container {
      flex: 1;
      overflow: auto;
      background: #d8dce3;
      display: flex;
      align-items: flex-start;
      padding: 28px 32px;
      gap: 0;
    }
    #canvas-wrap {
      flex-shrink: 0;
    }
    #slide-labels {
      display: flex;
      margin-bottom: 6px;
    }
    .slide-label {
      font-size: 11px;
      color: #444c5a;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.3px;
    }
    #canvas-shadow {
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      border-radius: 2px;
      overflow: hidden;
      display: inline-block;
    }

    /* ── Status bar ── */
    #statusbar {
      background: white;
      border-top: 1px solid #dde1e7;
      padding: 6px 20px;
      font-size: 12px;
      color: #606770;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }

    /* ── Loading overlay ── */
    #loading {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    #loading.show { display: flex; }
    .loading-box {
      background: white;
      border-radius: 14px;
      padding: 36px 52px;
      text-align: center;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid #e4e6eb;
      border-top-color: #1877f2;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-box p { margin-top: 14px; font-size: 14px; color: #444; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: rgba(28,30,33,0.92);
      color: white;
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 13px;
      opacity: 0;
      transition: all 0.25s;
      pointer-events: none;
      z-index: 1000;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #file-input, #bg-color-input { display: none; }
  </style>
</head>
<body>

<!-- Header -->
<div id="header">
  <h1>🔲 無縫輪播製作工具 — Facebook</h1>
  <div class="slide-counter">
    <label>格數</label>
    <button class="count-btn" onclick="changeSlides(-1)">−</button>
    <span id="slide-num">6</span>
    <button class="count-btn" onclick="changeSlides(+1)">+</button>
  </div>
  <button id="btn-export" onclick="exportSlides()">⬇ 匯出所有格</button>
</div>

<!-- Toolbar -->
<div id="toolbar">
  <button class="tool-btn blue" onclick="document.getElementById('file-input').click()">
    📷 上傳照片
  </button>
  <div class="divider"></div>
  <button class="tool-btn" onclick="document.getElementById('bg-color-input').click()">
    🎨 背景色
  </button>
  <button class="tool-btn" onclick="sendToBack()">⬇ 移至最下層</button>
  <button class="tool-btn" onclick="bringToFront()">⬆ 移至最上層</button>
  <button class="tool-btn" onclick="deleteSelected()">🗑 刪除選取</button>
  <button class="tool-btn" onclick="clearAll()">✕ 清除全部</button>
  <div class="divider"></div>
  <button class="tool-btn soon" onclick="comingSoon('文字')">T 文字 <span class="badge">即將推出</span></button>
  <button class="tool-btn soon" onclick="comingSoon('貼圖')">✨ 貼圖 <span class="badge">即將推出</span></button>
</div>

<!-- Canvas area -->
<div id="canvas-container">
  <div id="canvas-wrap">
    <div id="slide-labels"></div>
    <div id="canvas-shadow">
      <canvas id="main-canvas"></canvas>
    </div>
  </div>
</div>

<!-- Status bar -->
<div id="statusbar">
  <span id="status-msg">上傳照片開始製作 — 照片可橫跨多格，形成無縫效果</span>
  <span>Facebook 標準格式 1:1 正方形（匯出 1080×1080）</span>
</div>

<!-- Loading -->
<div id="loading">
  <div class="loading-box">
    <div class="spinner"></div>
    <p id="loading-text">正在產生圖片...</p>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Hidden inputs -->
<input type="file" id="file-input" accept="image/*" multiple onchange="handleFiles(this.files)">
<input type="color" id="bg-color-input" value="#ffffff" oninput="setBgColor(this.value)">

<script>
// ── Constants ──────────────────────────────────────────
const SLIDE_PX   = 300;   // display size per slide (px)
const EXPORT_PX  = 1080;  // export size per slide (px)
const MIN_SLIDES = 2;
const MAX_SLIDES = 20;
const DEFAULT_SLIDES = 6;

// ── State ──────────────────────────────────────────────
let canvas;
let numSlides = DEFAULT_SLIDES;
let bgColor   = '#ffffff';
let dividers  = [];

// ── Init ───────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  canvas = new fabric.Canvas('main-canvas', {
    width:           numSlides * SLIDE_PX,
    height:          SLIDE_PX,
    backgroundColor: bgColor,
    preserveObjectStacking: true,
  });

  canvas.on('selection:created', onSelect);
  canvas.on('selection:updated', onSelect);
  canvas.on('selection:cleared', () => setStatus('點擊選取物件，或上傳更多照片'));

  drawDividers();
  updateLabels();
  updateSlideNum();
});

// ── Dividers ───────────────────────────────────────────
function drawDividers() {
  dividers.forEach(l => canvas.remove(l));
  dividers = [];

  for (let i = 1; i < numSlides; i++) {
    const x = i * SLIDE_PX;
    const line = new fabric.Line([x, 0, x, SLIDE_PX], {
      stroke: '#1877f2',
      strokeWidth: 1.5,
      strokeDashArray: [8, 5],
      selectable: false,
      evented:    false,
      _div:       true,
    });
    canvas.add(line);
    dividers.push(line);
  }
  dividers.forEach(l => canvas.bringToFront(l));
  canvas.renderAll();
}

// ── Slide count ────────────────────────────────────────
function changeSlides(delta) {
  const n = Math.min(MAX_SLIDES, Math.max(MIN_SLIDES, numSlides + delta));
  if (n === numSlides) return;
  numSlides = n;
  canvas.setWidth(numSlides * SLIDE_PX);
  drawDividers();
  updateLabels();
  updateSlideNum();
}

function updateSlideNum() {
  document.getElementById('slide-num').textContent = numSlides;
}

function updateLabels() {
  const el = document.getElementById('slide-labels');
  el.innerHTML = '';
  for (let i = 1; i <= numSlides; i++) {
    const d = document.createElement('div');
    d.className = 'slide-label';
    d.style.width = SLIDE_PX + 'px';
    d.textContent = `第 ${i} 格`;
    el.appendChild(d);
  }
}

// ── Upload photos ──────────────────────────────────────
function handleFiles(files) {
  if (!files || files.length === 0) return;
  const arr = Array.from(files);
  showToast(`正在載入 ${arr.length} 張照片...`);
  let loaded = 0;
  let failed = 0;

  arr.forEach((file, idx) => {
    if (!file.type.startsWith('image/')) { failed++; return; }

    const reader = new FileReader();
    reader.onerror = () => {
      failed++;
      showToast('讀取失敗，請重試');
    };
    reader.onload = e => {
      // Create native img element first, then wrap with Fabric
      const dataURL = e.target.result;
      const imgEl = document.createElement('img');
      imgEl.onerror = () => {
        failed++;
        done();
      };
      imgEl.onload = () => {
        try {
          const fImg = new fabric.Image(imgEl);
          const maxSize = SLIDE_PX * 0.92;
          const w = imgEl.naturalWidth  || imgEl.width  || 1;
          const h = imgEl.naturalHeight || imgEl.height || 1;
          fImg.scale(maxSize / Math.max(w, h));

          const slideIdx = idx % numSlides;
          fImg.set({
            left: slideIdx * SLIDE_PX + 8,
            top:  Math.round((SLIDE_PX - fImg.getScaledHeight()) / 2),
            cornerSize:         10,
            cornerStyle:        'circle',
            transparentCorners: false,
            cornerColor:        '#1877f2',
            borderColor:        '#1877f2',
            borderScaleFactor:  1.5,
          });

          canvas.add(fImg);
          canvas.setActiveObject(fImg);
          dividers.forEach(l => canvas.bringToFront(l));
          canvas.renderAll();
          loaded++;
        } catch(err) {
          console.error(err);
          failed++;
        }
        done();
      };
      imgEl.src = dataURL;
    };
    reader.readAsDataURL(file);
  });

  function done() {
    if (loaded + failed < arr.length) return;
    if (loaded > 0) {
      showToast(`✅ 已新增 ${loaded} 張照片`);
      setStatus('拖曳照片調整位置，可讓照片橫跨多格形成無縫效果');
    } else {
      showToast('載入失敗，請換張圖片試試');
    }
    document.getElementById('file-input').value = '';
  }
}

// ── Background color ───────────────────────────────────
function setBgColor(color) {
  bgColor = color;
  canvas.setBackgroundColor(color, canvas.renderAll.bind(canvas));
}

// ── Layer controls ─────────────────────────────────────
function sendToBack() {
  const objs = canvas.getActiveObjects().filter(o => !o._div);
  objs.forEach(o => canvas.sendToBack(o));
  dividers.forEach(l => canvas.bringToFront(l));
  canvas.renderAll();
}

function bringToFront() {
  const objs = canvas.getActiveObjects().filter(o => !o._div);
  objs.forEach(o => canvas.bringToFront(o));
  dividers.forEach(l => canvas.bringToFront(l));
  canvas.renderAll();
}

// ── Delete / Clear ─────────────────────────────────────
function deleteSelected() {
  const sel = canvas.getActiveObjects().filter(o => !o._div);
  if (!sel.length) { showToast('請先選取要刪除的物件'); return; }
  sel.forEach(o => canvas.remove(o));
  canvas.discardActiveObject();
  canvas.renderAll();
  showToast('已刪除');
}

function clearAll() {
  const items = canvas.getObjects().filter(o => !o._div);
  if (!items.length) { showToast('畫布已空'); return; }
  if (!confirm(`確定清除畫布上全部 ${items.length} 個物件？`)) return;
  items.forEach(o => canvas.remove(o));
  canvas.renderAll();
  showToast('已清除全部');
}

// ── Export ─────────────────────────────────────────────
async function exportSlides() {
  const content = canvas.getObjects().filter(o => !o._div);
  if (!content.length) { showToast('請先上傳照片'); return; }

  showLoading(true, '準備中...');

  try {
    // Hide dividers
    dividers.forEach(l => l.visible = false);
    canvas.renderAll();

    // Render full canvas at export resolution
    const scale = EXPORT_PX / SLIDE_PX;
    const fullDataURL = canvas.toDataURL({ format: 'png', multiplier: scale });

    // Restore dividers
    dividers.forEach(l => l.visible = true);
    canvas.renderAll();

    // Load rendered image
    const fullImg = await loadImage(fullDataURL);

    const zip = new JSZip();

    for (let i = 0; i < numSlides; i++) {
      showLoading(true, `正在產生第 ${i + 1} / ${numSlides} 格...`);

      const off = document.createElement('canvas');
      off.width = off.height = EXPORT_PX;
      const ctx = off.getContext('2d');

      // Background
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, EXPORT_PX, EXPORT_PX);

      // Slice
      ctx.drawImage(fullImg,
        i * EXPORT_PX, 0, EXPORT_PX, EXPORT_PX,
        0, 0, EXPORT_PX, EXPORT_PX
      );

      const blob = await toBlob(off);
      zip.file(`第${String(i+1).padStart(2,'0')}格.png`, blob);
    }

    showLoading(true, '打包下載中...');
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    saveAs(zipBlob, `無縫輪播_${numSlides}格.zip`);
    showToast(`🎉 已匯出 ${numSlides} 張圖片，上傳到 Facebook 時請按順序貼上`);
  } catch (err) {
    console.error(err);
    showToast('匯出失敗，請重試');
  } finally {
    showLoading(false);
  }
}

// ── Helpers ────────────────────────────────────────────
function loadImage(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src;
  });
}

function toBlob(cvs) {
  return new Promise(res => cvs.toBlob(res, 'image/png'));
}

function onSelect() {
  const n = canvas.getActiveObjects().filter(o => !o._div).length;
  setStatus(n === 1 ? '拖曳移動 · 角落縮放 · Del 鍵刪除' : `已選取 ${n} 個物件`);
}

function setStatus(msg) {
  document.getElementById('status-msg').textContent = msg;
}

function comingSoon(f) { showToast(`${f}功能即將推出 🚀`); }

let _toastT;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => el.classList.remove('show'), 3500);
}

function showLoading(show, txt) {
  document.getElementById('loading').classList.toggle('show', show);
  if (txt) document.getElementById('loading-text').textContent = txt;
}

// ── Keyboard shortcuts ─────────────────────────────────
document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
  if (e.key === 'Escape') { canvas.discardActiveObject(); canvas.renderAll(); }
  if (e.key === '[') sendToBack();
  if (e.key === ']') bringToFront();
});
</script>

</body>
</html>
