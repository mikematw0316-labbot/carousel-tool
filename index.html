<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>FB.IG製圖神器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#000; --s1:#111; --border:#2a2a2a; --accent:#fff; --blue:#0095f6; }
    *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body{ background:var(--bg); color:var(--accent); font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif; height:100vh; overflow:hidden; }
    .page{ position:fixed; inset:0; display:flex; flex-direction:column; background:var(--bg); transition:transform .25s; }
    .page.off-right{ transform:translateX(100%); }
    .page.off-left{ transform:translateX(-30%); opacity:.5; pointer-events:none; }

    .hdr{ display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); flex-shrink:0; min-height:52px; }
    .hdr h1{ font-size:16px; font-weight:600; flex:1; text-align:center; }
    .hbtn{ background:none; border:none; color:var(--accent); cursor:pointer; padding:6px; min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center; font-size:15px; }
    .hbtn.lg{ font-size:24px; }
    .hbtn.blue{ color:var(--blue); font-weight:600; }

    #tpl-grid{ flex:1; overflow-y:auto; display:grid; grid-template-columns:1fr; gap:2px; background:#1a1a1a; padding:0 2px; }
    .cat-hdr{ background:#000; padding:22px 16px 8px; font-size:10px; font-weight:600; color:rgba(255,255,255,.65); letter-spacing:.14em; text-transform:uppercase; }
    .tcard{ background:#111; cursor:pointer; position:relative; overflow:hidden; outline:1px solid rgba(255,255,255,.12); }
    .tcard:active{ opacity:.8; }
    .tcard img{ display:block; pointer-events:none; }
    .tcard-info{ position:absolute; bottom:0; left:0; right:0; padding:36px 14px 12px; background:linear-gradient(transparent,rgba(0,0,0,.92)); display:flex; align-items:flex-end; justify-content:space-between; pointer-events:none; }
    .tcard-name{ font-size:13px; font-weight:600; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.8); }
    .tcard-meta{ font-size:11px; color:rgba(255,255,255,.5); text-shadow:0 1px 3px rgba(0,0,0,.8); }
    .tcard-badge{ position:absolute; top:10px; right:10px; font-size:10px; font-weight:700; padding:3px 7px; border-radius:6px; letter-spacing:.06em; pointer-events:none; }
    .tcard-badge.fb{ background:#1877f2; color:#fff; }
    .tcard-badge.ig{ background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); color:#fff; }
    #cat-nav{ flex-shrink:0; display:flex; align-items:center; background:#111; border-top:1px solid #1e1e1e; padding:6px 8px; padding-bottom:max(10px,env(safe-area-inset-bottom)); gap:4px; }
    .cat-nav-btn{ flex:1; background:none; border:1px solid #2a2a2a; border-radius:20px; color:rgba(255,255,255,.6); font-size:12px; font-weight:500; padding:7px 4px; cursor:pointer; font-family:inherit; }
    .cat-nav-btn:active{ background:#222; color:#fff; }
    .cat-nav-div{ width:1px; background:#2a2a2a; align-self:stretch; margin:4px 2px; flex-shrink:0; }
    .filter-btn{ background:#1a1a1a; border:1.5px solid #333; border-radius:16px; color:rgba(255,255,255,.4); font-size:11px; font-weight:700; padding:5px 10px; cursor:pointer; display:flex; align-items:center; gap:3px; letter-spacing:.04em; flex-shrink:0; font-family:inherit; transition:background .15s,color .15s,border-color .15s; }
    .filter-btn .chk{ font-size:10px; }
    .filter-btn.fb.on{ background:#1877f2; border-color:#1877f2; color:#fff; }
    .filter-btn.ig.on{ background:linear-gradient(135deg,#f09433,#dc2743,#bc1888); border-color:transparent; color:#fff; }
    .tcard-scroll{ position:absolute; top:0; left:0; width:100%; height:100%; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; touch-action:pan-x; overscroll-behavior-x:contain; }
    .tcard-scroll::-webkit-scrollbar{ display:none; }
    .tcard-arrow{ position:absolute; right:10px; top:50%; transform:translateY(-50%); background:rgba(0,0,0,.55); color:#fff; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; line-height:1; pointer-events:none; z-index:5; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); transition:opacity .3s; }
    .tcard-scroll.scrolled + .tcard-arrow{ opacity:0; }

    #editor-scroll{ flex:1; overflow:auto; background:#111; -webkit-overflow-scrolling:touch; display:flex; align-items:center; justify-content:flex-start; padding:16px; }
    #editor-canvas{ display:block; touch-action:none; flex-shrink:0; }

    #export-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.96); z-index:200; display:none; flex-direction:column; }
    #export-overlay.show{ display:flex; }
    #export-hdr{ display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); flex-shrink:0; }
    #export-hdr h2{ flex:1; text-align:center; font-size:16px; }
    #export-close{ background:none; border:none; color:var(--accent); font-size:22px; cursor:pointer; min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center; }
    #export-tip{ padding:10px 16px 6px; font-size:13px; color:#777; text-align:center; flex-shrink:0; }
    #export-imgs{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:16px; padding:16px; -webkit-overflow-scrolling:touch; align-items:center; }
    .export-item{ width:100%; max-width:400px; }
    .export-item img{ width:100%; display:block; border-radius:6px; }
    .export-label{ font-size:12px; color:#555; text-align:center; margin-top:6px; }

    #zoom-ctrl{ position:absolute; right:14px; bottom:82px; display:none; flex-direction:column; gap:6px; z-index:50; }
    #zoom-ctrl.show{ display:flex; }
    .zbtn{ width:42px; height:42px; border-radius:50%; background:rgba(18,18,18,.9); border:1px solid rgba(255,255,255,.14); color:#fff; font-size:22px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
    #editor-bottom{ flex-shrink:0; padding:8px 20px; padding-bottom:max(14px,env(safe-area-inset-bottom)); background:#000; display:none; }
    #editor-bottom.show{ display:block; }
    #editor-hint{ color:rgba(255,255,255,.4); font-size:11px; text-align:center; padding:4px 0 10px; pointer-events:none; letter-spacing:.02em; }
    #save-btn{ width:100%; height:50px; border-radius:25px; background:#fff; border:none; color:#000; font-size:16px; font-weight:600; cursor:pointer; }
    #update-btn{ position:fixed; display:none; flex-direction:column; gap:8px; z-index:150; transform:translate(-50%,-50%); align-items:center; pointer-events:none; }
    #update-btn.show{ display:flex; pointer-events:auto; }
    #update-btn button{ background:rgba(10,10,10,.88); border:1px solid rgba(255,255,255,.18); color:#fff; padding:11px 24px; border-radius:24px; font-size:14px; font-weight:500; cursor:pointer; min-height:44px; white-space:nowrap; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
    #update-btn .ubtn-cancel{ font-size:12px; padding:8px 20px; color:rgba(255,255,255,.5); background:rgba(0,0,0,.6); }
    #file-input{ display:none; }
    #toast{ position:fixed; bottom:40px; left:50%; transform:translateX(-50%) translateY(10px); background:rgba(20,20,20,.93); color:#fff; padding:9px 18px; border-radius:20px; font-size:13px; opacity:0; transition:all .25s; pointer-events:none; z-index:999; white-space:nowrap; max-width:82vw; text-align:center; }
    #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
    #editor-tools{ display:flex; gap:8px; padding:0 0 8px; }
    .tool-btn{ background:#222; border:1px solid #333; border-radius:20px; color:#fff; font-size:13px; font-weight:500; padding:7px 18px; cursor:pointer; min-height:36px; font-family:inherit; }
    #text-panel{ position:fixed; inset:0; background:rgba(0,0,0,.28); z-index:300; display:none; flex-direction:column; justify-content:flex-end; }
    #text-panel.show{ display:flex; }
    #text-panel-inner{ background:#1c1c1e; border-radius:20px 20px 0 0; padding:18px 16px; padding-bottom:max(22px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px; }
    #text-input{ width:100%; background:#2a2a2a; border:none; border-radius:12px; color:#fff; font-size:16px; padding:12px 14px; min-height:68px; resize:none; font-family:inherit; outline:none; }
    .topt-row{ display:flex; align-items:center; gap:8px; }
    .topt-lbl{ font-size:11px; color:#888; width:28px; flex-shrink:0; }
    .tsz-btn{ flex:1; background:#2a2a2a; border:1px solid #3a3a3a; border-radius:10px; color:#fff; font-size:13px; padding:7px 0; cursor:pointer; font-family:inherit; }
    .tsz-btn.sel{ background:#fff; color:#000; border-color:#fff; }
    .tclr-sw{ width:30px; height:30px; border-radius:50%; border:2px solid transparent; cursor:pointer; flex-shrink:0; }
    .tclr-sw.sel{ border-color:#0095f6; box-shadow:0 0 0 1px #0095f6; }
    .tbg-btn{ flex:1; background:#2a2a2a; border:1px solid #3a3a3a; border-radius:10px; color:#fff; font-size:12px; padding:7px 0; cursor:pointer; font-family:inherit; }
    .tbg-btn.sel{ border-color:#0095f6; }
    .tpanel-acts{ display:flex; gap:10px; margin-top:2px; }
    .tpanel-acts button{ flex:1; height:46px; border-radius:23px; border:none; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
    #tpanel-cancel{ background:#2a2a2a; color:#fff; }
    #tpanel-confirm{ background:#fff; color:#000; }
    .tfont-btn{ flex:1; background:#2a2a2a; border:1px solid #3a3a3a; border-radius:10px; color:#fff; font-size:13px; padding:7px 0; cursor:pointer; }
    .tfont-btn.sel{ background:#fff; color:#000; border-color:#fff; }
    .tshp-btn{ flex:1; background:#2a2a2a; border:1px solid #3a3a3a; border-radius:10px; color:#fff; font-size:12px; padding:6px 2px; cursor:pointer; font-family:inherit; }
    .tshp-btn.sel{ border-color:#0095f6; color:#0095f6; }
    .tbgc-sw{ width:28px; height:28px; border-radius:50%; border:2px solid transparent; cursor:pointer; flex-shrink:0; }
    .tbgc-sw.sel{ border-color:#0095f6; box-shadow:0 0 0 1px #0095f6; }
    #tbg-color-row{ display:none; }
    #tbg-color-row.show{ display:flex; }
    .tshd-btn{ flex:1; background:#2a2a2a; border:1px solid #3a3a3a; border-radius:10px; color:#fff; font-size:13px; padding:7px 0; cursor:pointer; font-family:inherit; }
    .tshd-btn.sel{ background:#fff; color:#000; border-color:#fff; }
    .tclr-picker-wrap{ position:relative; width:30px; height:30px; border-radius:50%; overflow:hidden; flex-shrink:0; cursor:pointer; border:2px solid #555; }
    .tclr-picker-wrap input[type=color]{ position:absolute; inset:-6px; width:calc(100%+12px); height:calc(100%+12px); border:none; cursor:pointer; padding:0; }
  </style>
</head>
<body>

<div id="pg-gallery" class="page">
  <div class="hdr">
    <div style="min-width:44px"></div>
    <h1>FB.IG製圖神器</h1>
    <div style="min-width:44px"></div>
  </div>
  <div id="tpl-grid"></div>
  <div id="cat-nav">
    <button id="filter-fb" class="filter-btn fb on" onclick="toggleFilter('fb')"><span class="chk">✓</span>FB</button>
    <button id="filter-ig" class="filter-btn ig on" onclick="toggleFilter('ig')"><span class="chk">✓</span>IG</button>
    <div class="cat-nav-div"></div>
    <button class="cat-nav-btn" onclick="scrollToCategory('portrait')">直式</button>
    <button class="cat-nav-btn" onclick="scrollToCategory('grid')">方格</button>
  </div>
</div>

<div id="pg-editor" class="page off-right">
  <div class="hdr">
    <button class="hbtn lg" onclick="goBack()">‹</button>
    <h1 id="editor-title">編輯</h1>
    <div style="min-width:44px"></div>
  </div>
  <div id="editor-scroll">
    <canvas id="editor-canvas"></canvas>
  </div>
  <div id="zoom-ctrl">
    <button class="zbtn" ontouchend="event.preventDefault();zoomEditor(1)" onclick="zoomEditor(1)">+</button>
    <button class="zbtn" ontouchend="event.preventDefault();zoomEditor(-1)" onclick="zoomEditor(-1)">−</button>
  </div>
  <div id="editor-bottom">
    <div id="editor-tools">
      <button class="tool-btn" onclick="openTextPanel(null)">文字</button>
    </div>
    <div id="editor-hint">點格子新增照片 · 右下角 +/− 縮放</div>
    <button id="save-btn" onclick="saveAll()">儲存</button>
  </div>
</div>

<div id="export-overlay">
  <div id="export-hdr">
    <div style="min-width:44px"></div>
    <h2>長按圖片儲存</h2>
    <button id="export-close" onclick="closeExport()">✕</button>
  </div>
  <div id="export-tip">📱 長按每張圖片 → 儲存到相冊，依序貼到 Facebook</div>
  <div id="export-imgs"></div>
</div>

<input type="file" id="file-input" accept="image/*" multiple>
<div id="update-btn">
  <button onclick="replacePhoto()">更換照片</button>
  <button class="ubtn-cancel" onclick="hideUpdateBtn()">取消</button>
</div>
<div id="text-panel">
  <div id="text-panel-inner">
    <textarea id="text-input" placeholder="輸入文字..." oninput="updatePreview()"></textarea>
    <div class="topt-row">
      <span class="topt-lbl">大小</span>
      <button class="tsz-btn sel" data-sz="28" onclick="selectTSz(this)">小</button>
      <button class="tsz-btn" data-sz="44" onclick="selectTSz(this)">中</button>
      <button class="tsz-btn" data-sz="62" onclick="selectTSz(this)">大</button>
    </div>
    <div class="topt-row">
      <span class="topt-lbl">字型</span>
      <button class="tfont-btn sel" data-f="sans" onclick="selectTFont(this)" style="font-family:-apple-system,'PingFang TC',sans-serif">黑體</button>
      <button class="tfont-btn" data-f="serif" onclick="selectTFont(this)" style="font-family:'Noto Serif TC',serif">明體</button>
      <button class="tfont-btn" data-f="round" onclick="selectTFont(this)" style="font-family:'Noto Sans TC',sans-serif;letter-spacing:.05em">圓體</button>
    </div>
    <div class="topt-row">
      <span class="topt-lbl">顏色</span>
      <div class="tclr-sw sel" data-c="#ffffff" style="background:#fff" onclick="selectTColor(this)"></div>
      <div class="tclr-sw" data-c="#000000" style="background:#000;border-color:#555" onclick="selectTColor(this)"></div>
      <div class="tclr-sw" data-c="#ff3b30" style="background:#ff3b30" onclick="selectTColor(this)"></div>
      <div class="tclr-sw" data-c="#ff9500" style="background:#ff9500" onclick="selectTColor(this)"></div>
      <div class="tclr-sw" data-c="#ffcc00" style="background:#ffcc00" onclick="selectTColor(this)"></div>
      <div class="tclr-sw" data-c="#34c759" style="background:#34c759" onclick="selectTColor(this)"></div>
      <div class="tclr-sw" data-c="#007aff" style="background:#007aff" onclick="selectTColor(this)"></div>
      <div class="tclr-sw" data-c="#af52de" style="background:#af52de" onclick="selectTColor(this)"></div>
      <label class="tclr-picker-wrap" id="tclr-custom-wrap" style="background:#888" title="自訂色">
        <input type="color" id="tclr-custom" value="#888888" oninput="selectTColorPicker(this)">
      </label>
    </div>
    <div class="topt-row">
      <span class="topt-lbl">陰影</span>
      <button class="tshd-btn sel" data-sh="none" onclick="selectTShadow(this)">無</button>
      <button class="tshd-btn" data-sh="light" onclick="selectTShadow(this)">淺</button>
      <button class="tshd-btn" data-sh="deep" onclick="selectTShadow(this)">深</button>
    </div>
    <div id="tshd-color-row" class="topt-row" style="display:none">
      <span class="topt-lbl">影色</span>
      <div class="tclr-sw sel" data-c="#000000" style="background:#000;border-color:#555" onclick="selectTShadowColor(this)"></div>
      <div class="tclr-sw" data-c="#ffffff" style="background:#fff" onclick="selectTShadowColor(this)"></div>
      <div class="tclr-sw" data-c="#ff3b30" style="background:#ff3b30" onclick="selectTShadowColor(this)"></div>
      <div class="tclr-sw" data-c="#ff9500" style="background:#ff9500" onclick="selectTShadowColor(this)"></div>
      <div class="tclr-sw" data-c="#ffcc00" style="background:#ffcc00" onclick="selectTShadowColor(this)"></div>
      <div class="tclr-sw" data-c="#34c759" style="background:#34c759" onclick="selectTShadowColor(this)"></div>
      <div class="tclr-sw" data-c="#007aff" style="background:#007aff" onclick="selectTShadowColor(this)"></div>
      <div class="tclr-sw" data-c="#af52de" style="background:#af52de" onclick="selectTShadowColor(this)"></div>
      <label class="tclr-picker-wrap" id="tshdclr-custom-wrap" style="background:#444" title="自訂色">
        <input type="color" id="tshdclr-custom" value="#000000" oninput="selectTShadowColorPicker(this)">
      </label>
    </div>
    <div class="topt-row">
      <span class="topt-lbl">底形</span>
      <button class="tshp-btn sel" data-sh="none" onclick="selectTBgShape(this)">無</button>
      <button class="tshp-btn" data-sh="roundrect" onclick="selectTBgShape(this)">▢圓角</button>
      <button class="tshp-btn" data-sh="capsule" onclick="selectTBgShape(this)">⬷膠囊</button>
      <button class="tshp-btn" data-sh="circle" onclick="selectTBgShape(this)">○圓</button>
      <button class="tshp-btn" data-sh="ellipse" onclick="selectTBgShape(this)">⬭橢圓</button>
      <button class="tshp-btn" data-sh="rect" onclick="selectTBgShape(this)">□方</button>
    </div>
    <div id="tbg-color-row" class="topt-row">
      <span class="topt-lbl">底色</span>
      <div class="tbgc-sw sel" data-bc="#000000" style="background:#000;border-color:#555" onclick="selectTBgColor(this)"></div>
      <div class="tbgc-sw" data-bc="#ffffff" style="background:#fff" onclick="selectTBgColor(this)"></div>
      <div class="tbgc-sw" data-bc="#ff3b30" style="background:#ff3b30" onclick="selectTBgColor(this)"></div>
      <div class="tbgc-sw" data-bc="#ff9500" style="background:#ff9500" onclick="selectTBgColor(this)"></div>
      <div class="tbgc-sw" data-bc="#ffcc00" style="background:#ffcc00" onclick="selectTBgColor(this)"></div>
      <div class="tbgc-sw" data-bc="#34c759" style="background:#34c759" onclick="selectTBgColor(this)"></div>
      <div class="tbgc-sw" data-bc="#007aff" style="background:#007aff" onclick="selectTBgColor(this)"></div>
      <div class="tbgc-sw" data-bc="#af52de" style="background:#af52de" onclick="selectTBgColor(this)"></div>
      <div class="tbgc-sw" data-bc="rgba(0,0,0,0.5)" style="background:rgba(0,0,0,.5)" onclick="selectTBgColor(this)"></div>
      <label class="tclr-picker-wrap" id="tbgc-custom-wrap" style="background:#444" title="自訂色">
        <input type="color" id="tbgc-custom" value="#444444" oninput="selectTBgColorPicker(this)">
      </label>
    </div>
    <div class="tpanel-acts">
      <button id="tpanel-cancel" onclick="closeTextPanel()">取消</button>
      <button id="tpanel-confirm" onclick="confirmTextEdit()">加入</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';

// ── Templates ─────────────────────────────────────────
// Regular slot:  {x, y, w, h}  — top-left origin, clip region, in slide-units
// Overlay slot:  {ov:true, cx, cy, w, h, rot?, frame?, shadow?}
//                cx/cy = center in slide-units; rot = degrees; frame = border % of min dim
const TPLS = [

  // ── 直式版型 (portrait, aspect 4:5 = 1.25) ──
  // Coordinate note: x/w in slide-width units; y/h in slide-HEIGHT units (0–1)
  // Overlay: cx in slide-width units, cy in slide-height units

  { id:'por1', cat:'portrait', name:'雙直全景', slides:2, photos:1, aspect:1.25,
    slots:[{x:0,y:0,w:2,h:1}] },

  // 三格錯位 — alternating up/down, black bg for stagger effect
  { id:'por6', cat:'portrait', name:'三直錯位', slides:3, photos:3, aspect:1.25, blackBg:true,
    slots:[{x:0,y:0,w:1,h:0.84},{x:1,y:0.16,w:1,h:0.84},{x:2,y:0,w:1,h:0.84}] },

  // 四直全景 — 一圖四格，1000×1920
  { id:'por4', cat:'portrait', name:'四直全景', slides:4, photos:1, aspect:1.92, exportW:1000, exportH:1920,
    slots:[{x:0,y:0,w:4,h:1}] },

  // 四格錯位 — 1000×1920，全幅匯出（FB版型自動錯位），預覽顯示黑邊錯位效果
  { id:'por6b', cat:'portrait', name:'四直錯位', slides:4, photos:4, aspect:1.92, exportW:1000, exportH:1920,
    previewSlots:[{x:0,y:0,w:1,h:0.84},{x:1,y:0.16,w:1,h:0.84},{x:2,y:0,w:1,h:0.84},{x:3,y:0.16,w:1,h:0.84}],
    slots:[{x:0,y:0,w:1,h:1},{x:1,y:0,w:1,h:1},{x:2,y:0,w:1,h:1},{x:3,y:0,w:1,h:1}] },

  // 四直押圖 — 全幅底圖 + 三張押圖，預覽錯位黑邊，匯出全幅（FB自動錯位）

// ── Nav ───────────────────────────────────────────────
function goTo(id) {
  const order = ['gallery','editor'];
  const pages = { gallery:'pg-gallery', editor:'pg-editor' };
  const toIdx = order.indexOf(id);
  order.forEach((p, i) => {
    const el = document.getElementById(pages[p]);
    el.classList.remove('off-right','off-left');
    if (i > toIdx) el.classList.add('off-right');
    if (i < toIdx) el.classList.add('off-left');
  });
}

function isOv(sl) { return !!sl.ov; }

// ── Gallery ───────────────────────────────────────────
let galleryFilter = { fb: true, ig: true };

function toggleFilter(type) {
  galleryFilter[type] = !galleryFilter[type];
  const btn = document.getElementById('filter-' + type);
  btn.classList.toggle('on', galleryFilter[type]);
  const chk = btn.querySelector('.chk');
  chk.textContent = galleryFilter[type] ? '✓' : '✕';
  buildGallery();
}

function scrollToCategory(cat) {
  const grid = document.getElementById('tpl-grid');
  const label = CAT_LABELS[cat] || cat;
  const hdrs = grid.querySelectorAll('.cat-hdr');
  for (const hdr of hdrs) {
    if (hdr.textContent.includes(label.replace(/[✦◎◈]/g,'').trim()) || hdr.textContent === label) {
      const gridRect = grid.getBoundingClientRect();
      const hdrRect = hdr.getBoundingClientRect();
      grid.scrollTo({ top: grid.scrollTop + (hdrRect.top - gridRect.top) - 4, behavior: 'smooth' });
      return;
    }
  }
}

function buildGallery() {
  const grid = document.getElementById('tpl-grid');
  grid.innerHTML = '';  // clear if rebuilding
  const screenW = window.innerWidth - 4;
  const MAX_TILE = 260;
  let lastCat = null;

  TPLS.forEach(tpl => {
    const isFB = tpl.slides === 2 || tpl.slides === 4;
    const isIG = tpl.slides === 3;
    if (isFB && !galleryFilter.fb) return;
    if (isIG && !galleryFilter.ig) return;

    if (tpl.cat !== lastCat) {
      lastCat = tpl.cat;
      const hdr = document.createElement('div');
      hdr.className = 'cat-hdr';
      hdr.textContent = CAT_LABELS[tpl.cat] || tpl.cat;
      grid.appendChild(hdr);
    }

    const card = document.createElement('div');
    card.className = 'tcard';
    card.onclick = () => startEditor(tpl);

    // Always fit all slides across screen width — no scrolling
    const tileW = Math.min(Math.floor(screenW / tpl.slides), MAX_TILE);
    let dataURL = '', cardH = tileW;

    if (tpl.preview2x2) {
      // Render a 2×2 grid preview using sample images
      try {
        const hw = Math.floor(screenW / 2);
        const pCvs = document.createElement('canvas');
        pCvs.width = hw * 2; pCvs.height = hw * 2;
        const pCtx = pCvs.getContext('2d');
        pCtx.fillStyle = '#111'; pCtx.fillRect(0, 0, hw*2, hw*2);
        [[0,0],[1,0],[0,1],[1,1]].forEach(([col, row], i) => {
          const img = sampleImgs[i % sampleImgs.length];
          const bx = col*hw, by = row*hw;
          if (img) {
            pCtx.save(); pCtx.beginPath(); pCtx.rect(bx+1, by+1, hw-2, hw-2); pCtx.clip();
            const s = Math.min(img.naturalWidth, img.naturalHeight);
            pCtx.drawImage(img, (img.naturalWidth-s)/2, (img.naturalHeight-s)/2, s, s, bx+1, by+1, hw-2, hw-2);
            pCtx.restore();
          }
        });
        pCtx.strokeStyle = 'rgba(255,255,255,.2)'; pCtx.lineWidth = 2;
        pCtx.beginPath(); pCtx.moveTo(hw, 0); pCtx.lineTo(hw, hw*2); pCtx.stroke();
        pCtx.beginPath(); pCtx.moveTo(0, hw); pCtx.lineTo(hw*2, hw); pCtx.stroke();
        // Overlay at center
        const ov5 = sampleImgs[4 % sampleImgs.length];
        const ow = hw * 0.52;
        pCtx.save(); pCtx.translate(hw, hw); pCtx.rotate(-4*Math.PI/180);
        pCtx.shadowColor='rgba(0,0,0,.5)'; pCtx.shadowBlur=10;
        pCtx.fillStyle='#f0f0f0'; pCtx.fillRect(-ow/2,-ow/2,ow,ow);
        pCtx.shadowBlur=0;
        if (ov5) { pCtx.save(); pCtx.beginPath(); pCtx.rect(-ow/2+3,-ow/2+3,ow-6,ow-6); pCtx.clip();
          const s=Math.min(ov5.naturalWidth,ov5.naturalHeight);
          pCtx.drawImage(ov5,(ov5.naturalWidth-s)/2,(ov5.naturalHeight-s)/2,s,s,-ow/2+3,-ow/2+3,ow-6,ow-6); pCtx.restore(); }
        pCtx.restore();
        cardH = hw * 2;
        dataURL = pCvs.toDataURL('image/jpeg', 0.88);
        pCvs.width = pCvs.height = 0;
      } catch(e) { console.warn('preview2x2 render failed', tpl.id, e); }
    } else {
      try {
        const tempCvs = document.createElement('canvas');
        drawLayout(tempCvs, tpl, tileW, true);
        cardH = Math.round(screenW * tempCvs.height / tempCvs.width);
        dataURL = tempCvs.toDataURL('image/jpeg', 0.88);
        tempCvs.width = tempCvs.height = 0;  // free iOS canvas memory
      } catch(e) {
        console.warn('preview render failed', tpl.id, e);
      }
    }

    card.style.height = cardH + 'px';

    const img = new Image();
    if (dataURL) img.src = dataURL;
    img.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;pointer-events:none;';
    card.appendChild(img);

    const info = document.createElement('div');
    info.className = 'tcard-info';
    info.innerHTML = `<span class="tcard-name">${tpl.name}</span><span class="tcard-meta">${tpl.slides}格 · ${tpl.photos}張 · 存${tpl.slides}圖</span>`;
    card.appendChild(info);
    if (tpl.slides === 2 || tpl.slides === 4) {
      const badge = document.createElement('div');
      badge.className = 'tcard-badge fb'; badge.textContent = 'FB';
      card.appendChild(badge);
    } else if (tpl.slides === 3) {
      const badge = document.createElement('div');
      badge.className = 'tcard-badge ig'; badge.textContent = 'IG';
      card.appendChild(badge);
    }
    grid.appendChild(card);
  });
}

// ── Draw layout (gallery preview) ────────────────────
function drawLayout(canvas, tpl, tileSize, gradient) {
  const aspect = tpl.aspect || 1;
  const W = tpl.slides * tileSize;
  const H = Math.round(tileSize * aspect);
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  // Gap between slots — 3px min so real photos have clear grid lines
  const gap = Math.max(3, tileSize * 0.024);
  // Photo-mood gradients: vivid, photo-like colours per slot
  const PHOTO_MOODS = [
    ['#e8b87a','#a06838'],
    ['#7ab4e0','#3870a8'],
    ['#a8cc80','#587840'],
    ['#f0a878','#a05838'],
    ['#88c0d0','#407888'],
    ['#e0b090','#906050'],
    ['#98cca8','#508060'],
    ['#c8a8d0','#786088'],
  ];

  // Pass 1: regular (background) slots
  // x/w in slide-width units; y/h in slide-height units
  const previewSrc = tpl.previewSlots || tpl.slots;
  let slotIdx = 0;
  previewSrc.forEach((sl, i) => {
    if (isOv(sl)) return;
    const sx=sl.x*tileSize, sy=sl.y*H, sw=sl.w*tileSize, sh=sl.h*H;
    const x0=sx+gap, y0=sy+gap, w0=sw-gap*2, h0=sh-gap*2;
    const sImg = sampleImgs[slotIdx % sampleImgs.length];
    slotIdx++;
    if (sImg && sImg.naturalWidth) {
      ctx.save();
      ctx.beginPath(); ctx.rect(x0, y0, w0, h0); ctx.clip();
      const pAR = sImg.naturalWidth / sImg.naturalHeight, sAR = w0 / h0;
      let dw, dh;
      if (pAR > sAR) { dh = h0; dw = dh * pAR; } else { dw = w0; dh = dw / pAR; }
      ctx.drawImage(sImg, x0 + (w0-dw)/2, y0 + (h0-dh)/2, dw, dh);
      ctx.restore();
    } else {
      const mood = PHOTO_MOODS[slotIdx % PHOTO_MOODS.length];
      const g = ctx.createLinearGradient(x0, y0, x0+w0, y0+h0);
      g.addColorStop(0, mood[0]); g.addColorStop(1, mood[1]);
      ctx.fillStyle = g; ctx.fillRect(x0,y0,w0,h0);
    }
  });

  // Slide dividers
  ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = Math.max(2, gap);
  for (let i=1; i<tpl.slides; i++) {
    ctx.beginPath(); ctx.moveTo(i*tileSize,0); ctx.lineTo(i*tileSize,H); ctx.stroke();
  }

  // Pass 2: overlay slots — count regular slots to continue photo index
  const regCount = previewSrc.filter(s => !isOv(s)).length;
  let ovIdx = regCount;
  previewSrc.forEach((sl, i) => {
    if (!isOv(sl)) return;
    drawOvPreview(ctx, sl, tileSize, H, sampleImgs[ovIdx % sampleImgs.length] || null);
    ovIdx++;
  });
}

function drawOvPreview(ctx, sl, tileSize, H, sImg) {
  const cx=sl.cx*tileSize, cy=sl.cy*H;
  const w=sl.w*tileSize, h=sl.h*tileSize;
  const rot=(sl.rot||0)*Math.PI/180;
  const fw = sl.frame ? Math.max(1, Math.round(2 * tileSize / LOGICAL_S)) : 0;

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rot);

  if (sl.shadow) {
    ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=8; ctx.shadowOffsetX=2; ctx.shadowOffsetY=3;
  }
  if (fw>0) {
    ctx.fillStyle = OV_FRM_COLOR;
    ctx.fillRect(-w/2,-h/2,w,h);
    ctx.shadowColor='transparent'; ctx.shadowBlur=0;
  }
  const iw=w-fw*2, ih=h-fw*2;
  if (sImg && sImg.naturalWidth) {
    ctx.save();
    ctx.beginPath(); ctx.rect(-iw/2,-ih/2,iw,ih); ctx.clip();
    const pAR = sImg.naturalWidth/sImg.naturalHeight, sAR = iw/ih;
    let dw, dh;
    if (pAR > sAR) { dh=ih; dw=dh*pAR; } else { dw=iw; dh=dw/pAR; }
    ctx.drawImage(sImg, -dw/2, -dh/2, dw, dh);
    ctx.restore();
  } else {
    const og = ctx.createLinearGradient(-iw/2,-ih/2,iw/2,ih/2);
    og.addColorStop(0,'#e0b088'); og.addColorStop(1,'#986048');
    ctx.fillStyle = og;
    ctx.fillRect(-iw/2,-ih/2,iw,ih);
  }
  ctx.restore();
}

// ── Editor ────────────────────────────────────────────
let evBound = false;

function startEditor(tpl) {
  curTpl = tpl;
  slotPhotos = tpl.slots.map(() => null);
  activeSlot = -1;
  textLayers = []; activeTextId = null;
  document.getElementById('editor-title').textContent = tpl.name;

  const cvs = document.getElementById('editor-canvas');
  if (tpl.preview2x2) {
    cvs.width = 2 * LOGICAL_S; cvs.height = 2 * LOGICAL_S;
  } else {
    cvs.width  = tpl.slides * LOGICAL_S;
    cvs.height = Math.round(LOGICAL_S * (tpl.aspect || 1));
  }

  const scrollEl = document.getElementById('editor-scroll');
  const availW = scrollEl.clientWidth  || window.innerWidth;
  const availH = (scrollEl.clientHeight || window.innerHeight) - 52;
  // Fit all slides on screen so no slot is off-screen / unreachable
  viewScale = Math.min(1, (availW-32)/cvs.width, (availH-32)/cvs.height);
  applyViewScale();

  // Editor scroll bg matches template mood
  document.getElementById('editor-scroll').style.background = tpl.bg ? '#1e1a16' : '#111';

  renderEditor();
  if (!evBound) { bindEvents(); evBound = true; }
  document.getElementById('zoom-ctrl').classList.add('show');
  document.getElementById('editor-bottom').classList.add('show');
  goTo('editor');
}

function zoomEditor(dir) {
  viewScale = Math.max(0.1, Math.min(3, viewScale * (dir > 0 ? 1.3 : 1/1.3)));
  applyViewScale();
}

function applyViewScale() {
  const cvs = document.getElementById('editor-canvas');
  const scroll = document.getElementById('editor-scroll');
  const dw = cvs.width * viewScale, dh = cvs.height * viewScale;
  cvs.style.width = dw+'px'; cvs.style.height = dh+'px';
  // Center if narrower than scroll area, left-align (scrollable) if wider
  const avail = (scroll.clientWidth || window.innerWidth) - 32;
  cvs.style.marginLeft = dw < avail ? ((avail - dw) / 2) + 'px' : '0';
}

// ── Render editor ─────────────────────────────────────
function renderEditor() {
  const tpl = curTpl;
  const cvs = document.getElementById('editor-canvas');
  const ctx = cvs.getContext('2d');
  const S = LOGICAL_S, G = 3;

  if (tpl.preview2x2) {
    const H2 = 2*S;
    ctx.fillStyle = tpl.bg||(tpl.blackBg?'#000':'#111'); ctx.fillRect(0, 0, 2*S, H2);
    // Pass 1: 2×2 regular slots (index 0=TL,1=TR,2=BL,3=BR)
    tpl.slots.forEach((sl, i) => {
      if (isOv(sl)) return;
      const col = i%2, row = Math.floor(i/2);
      const sx=col*S, sy=row*S;
      const x0=sx+G, y0=sy+G, w0=S-G*2, h0=S-G*2;
      const ph = slotPhotos[i];
      ctx.save(); ctx.beginPath(); ctx.rect(x0,y0,w0,h0); ctx.clip();
      if (ph && ph.img) {
        drawPhotoClip(ctx, ph.img, sx, sy, S, S, ph.ox, ph.oy, ph.scale);
      } else {
        ctx.fillStyle = i===activeSlot ? '#3a3a3a' : '#2a2a2a'; ctx.fillRect(x0,y0,w0,h0);
        drawPlus(ctx, sx+S/2, sy+S/2, 22, i===activeSlot);
      }
      ctx.restore();
      if (i===activeSlot) { ctx.strokeStyle='#0095f6'; ctx.lineWidth=3; ctx.strokeRect(sx+1.5,sy+1.5,S-3,S-3); }
      if (i===swapOverSlot) { ctx.fillStyle='rgba(255,255,255,.22)'; ctx.fillRect(sx,sy,S,S); ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.strokeRect(sx+1.5,sy+1.5,S-3,S-3); }
    });
    ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(S,0); ctx.lineTo(S,H2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,S); ctx.lineTo(2*S,S); ctx.stroke();
    // Pass 2: overlay slots — remap cx to center of 2×2 canvas
    tpl.slots.forEach((sl, i) => {
      if (!isOv(sl)) return;
      drawOvSlot(ctx, {...sl, cx:1.0, cy:0.5}, i, S, H2, false);
    });
    // Pass 3: text layers
    textLayers.forEach(tl => {
      if (previewText && tl.id === textEditingId) return;
      drawTextOnCtx(ctx, tl.text, tl.x, tl.y, tl.fontSize, tl.color, tl.bgShape||'none', tl.bgColor||'#000', tl.fontFam||'sans', tl.shadow||'none', tl.rot||0, tl.shadowColor||'#000000');
      if (tl.id === activeTextId && !previewText) drawTextHandles(ctx, tl);
    });
    if (previewText) drawTextOnCtx(ctx, previewText.text, previewText.x, previewText.y, previewText.fontSize, previewText.color, previewText.bgShape||'none', previewText.bgColor||'#000', previewText.fontFam||'sans', previewText.shadow||'none', 0, previewText.shadowColor||'#000000');
    return;
  }

  const H = Math.round(S * (tpl.aspect || 1));

  const isLightBg = !!tpl.bg;
  ctx.fillStyle = tpl.bg || (tpl.blackBg ? '#000' : '#111');
  ctx.fillRect(0,0,cvs.width,cvs.height);

  // Subtle vignette for cream/paper bg in editor
  if (isLightBg) {
    const rg = ctx.createRadialGradient(cvs.width/2,H/2,0, cvs.width/2,H/2,Math.max(cvs.width,H)*0.65);
    rg.addColorStop(0,'rgba(0,0,0,0)');
    rg.addColorStop(1,'rgba(0,0,0,0.07)');
    ctx.fillStyle=rg; ctx.fillRect(0,0,cvs.width,H);
  }

  // Pass 1: regular slots (x/w in slide-width units; y/h in slide-height units)
  const editorSrc = tpl.previewSlots || tpl.slots;
  editorSrc.forEach((sl, i) => {
    if (isOv(sl)) return;
    const sx=sl.x*S, sy=sl.y*H, sw=sl.w*S, sh=sl.h*H;
    const x0=sx+G, y0=sy+G, w0=sw-G*2, h0=sh-G*2;
    ctx.save();
    ctx.beginPath(); ctx.rect(x0,y0,w0,h0); ctx.clip();
    const ph=slotPhotos[i];
    if (ph&&ph.img) {
      drawPhotoClip(ctx, ph.img, sx, sy, sw, sh, ph.ox, ph.oy, ph.scale);
    } else {
      ctx.fillStyle='#1d1d1d'; ctx.fillRect(x0,y0,w0,h0);
      drawPlus(ctx, sx+sw/2, sy+sh/2, Math.min(sw,sh)*0.13, i===activeSlot);
    }
    ctx.restore();
    if (i===activeSlot) {
      ctx.strokeStyle='#0095f6'; ctx.lineWidth=3;
      ctx.strokeRect(x0+1.5,y0+1.5,w0-3,h0-3);
    }
    if (i===swapOverSlot) {
      ctx.fillStyle='rgba(255,255,255,.22)';
      ctx.fillRect(x0,y0,w0,h0);
      ctx.strokeStyle='#fff'; ctx.lineWidth=3;
      ctx.strokeRect(x0+1.5,y0+1.5,w0-3,h0-3);
    }
  });

  // Slide dividers
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1;
  for (let i=1; i<tpl.slides; i++) {
    ctx.beginPath(); ctx.moveTo(i*S,0); ctx.lineTo(i*S,H); ctx.stroke();
  }

  // Pass 2: overlay slots (on top)
  editorSrc.forEach((sl, i) => {
    if (!isOv(sl)) return;
    drawOvSlot(ctx, sl, i, S, H, isLightBg);
  });

  // Pass 3: text layers
  textLayers.forEach(tl => {
    if (previewText && tl.id === textEditingId) return; // live preview replaces this layer
    drawTextOnCtx(ctx, tl.text, tl.x, tl.y, tl.fontSize, tl.color, tl.bgShape||'none', tl.bgColor||'#000', tl.fontFam||'sans', tl.shadow||'none', tl.rot||0, tl.shadowColor||'#000000');
    if (tl.id === activeTextId && !previewText) drawTextHandles(ctx, tl);
  });
  if (previewText) {
    drawTextOnCtx(ctx, previewText.text, previewText.x, previewText.y, previewText.fontSize, previewText.color, previewText.bgShape||'none', previewText.bgColor||'#000', previewText.fontFam||'sans', previewText.shadow||'none', 0, previewText.shadowColor||'#000000');
  }
}

function drawPlus(ctx, cx, cy, r, active, darkBg=true) {
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle = active ? (darkBg?'#555':'#888') : (darkBg?'rgba(70,70,70,.85)':'rgba(150,150,150,.8)');
  ctx.fill();
  ctx.fillStyle = darkBg ? '#fff' : '#fff';
  ctx.font=`bold ${r*1.5}px sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('+',cx,cy);
}

function drawPhotoClip(ctx, img, slotX, slotY, slotW, slotH, ox, oy, scale) {
  const AR=img.naturalWidth/img.naturalHeight, sAR=slotW/slotH;
  let dw,dh;
  if(AR>sAR){dh=slotH*scale;dw=dh*AR;}else{dw=slotW*scale;dh=dw/AR;}
  ctx.drawImage(img, slotX+(slotW-dw)/2+ox, slotY+(slotH-dh)/2+oy, dw, dh);
}

function drawOvSlot(ctx, sl, i, S, H, lightBg=false) {
  const cx=sl.cx*S, cy=sl.cy*H, w=sl.w*S, h=sl.h*S;
  const rot=(sl.rot||0)*Math.PI/180;
  const fw = sl.frame ? 2 : 0;
  const ph=slotPhotos[i];

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rot);

  if (sl.shadow) {
    ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=14; ctx.shadowOffsetX=3; ctx.shadowOffsetY=4;
  }
  if (fw>0) {
    ctx.fillStyle='#f0f0f0'; ctx.fillRect(-w/2,-h/2,w,h);
    ctx.shadowColor='transparent'; ctx.shadowBlur=0;
  }

  const iw=w-fw*2, ih=h-fw*2;
  ctx.save();
  ctx.beginPath(); ctx.rect(-iw/2,-ih/2,iw,ih); ctx.clip();

  if (ph&&ph.img) {
    const img=ph.img;
    const AR=img.naturalWidth/img.naturalHeight, sAR=iw/ih;
    let dw,dh;
    if(AR>sAR){dh=ih*ph.scale;dw=dh*AR;}else{dw=iw*ph.scale;dh=dw/AR;}
    ctx.drawImage(img, -(dw/2)+ph.ox, -(dh/2)+ph.oy, dw, dh);
  } else {
    // Empty overlay slot: warm gray on light bg, dark gray on dark bg
    ctx.fillStyle = lightBg ? '#c8c3be' : '#2a2a2a';
    ctx.fillRect(-iw/2,-ih/2,iw,ih);
    drawPlus(ctx, 0, 0, Math.min(iw,ih)*0.13, i===activeSlot);
  }
  ctx.restore();

  if (i===activeSlot) {
    ctx.strokeStyle='#0095f6'; ctx.lineWidth=2.5;
    ctx.strokeRect(-iw/2+1,-ih/2+1,iw-2,ih-2);
  }
  ctx.restore();
}

// ── Update button (replace photo) ────────────────────
let updateBtnSlot = -1;
function showUpdateBtn(si) {
  updateBtnSlot = si;
  const sl = (curTpl.previewSlots || curTpl.slots)[si];
  const cvs = document.getElementById('editor-canvas');
  const rect = cvs.getBoundingClientRect();
  const S = LOGICAL_S;
  const H = Math.round(S * (curTpl.aspect || 1));
  let bx, by;
  if (curTpl.preview2x2) {
    if (isOv(sl)) { bx = rect.left + S * viewScale; by = rect.top + S * viewScale; }
    else { const col=si%2, row=Math.floor(si/2); bx=rect.left+(col+0.5)*S*viewScale; by=rect.top+(row+0.5)*S*viewScale; }
  } else if (isOv(sl)) {
    bx = rect.left + sl.cx * S * viewScale;
    by = rect.top  + sl.cy * H * viewScale;
  } else {
    bx = rect.left + (sl.x + sl.w / 2) * S * viewScale;
    by = rect.top  + (sl.y + sl.h / 2) * H * viewScale;
  }
  const btn = document.getElementById('update-btn');
  btn.style.left = bx + 'px';
  btn.style.top  = by + 'px';
  btn.classList.add('show');
}
function hideUpdateBtn() {
  document.getElementById('update-btn').classList.remove('show');
  updateBtnSlot = -1;
}
function replacePhoto() {
  if (updateBtnSlot < 0) return;
  activeSlot = updateBtnSlot;
  hideUpdateBtn();
  document.getElementById('file-input').click();
}

// ── Hit testing ───────────────────────────────────────
function hitSlot(x, y) {
  const S = LOGICAL_S;
  const H = Math.round(S * (curTpl.aspect || 1));

  const hitSrc = curTpl.previewSlots || curTpl.slots;

  if (curTpl.preview2x2) {
    for (let i=hitSrc.length-1; i>=0; i--) {
      const sl=hitSrc[i];
      if (!isOv(sl)) continue;
      const hw=sl.w*S/2, hh=sl.h*S/2;
      const ang=-(sl.rot||0)*Math.PI/180, dx=x-S, dy=y-S;
      const lx=dx*Math.cos(ang)-dy*Math.sin(ang), ly=dx*Math.sin(ang)+dy*Math.cos(ang);
      if(Math.abs(lx)<=hw && Math.abs(ly)<=hh) return i;
    }
    for (let i=0; i<hitSrc.length; i++) {
      const sl=hitSrc[i];
      if(isOv(sl)) continue;
      const col=i%2, row=Math.floor(i/2);
      if(x>=col*S && x<(col+1)*S && y>=row*S && y<(row+1)*S) return i;
    }
    return -1;
  }

  // Overlay slots are on top → check in reverse order first
  for (let i=hitSrc.length-1; i>=0; i--) {
    const sl=hitSrc[i];
    if (!isOv(sl)) continue;
    const cx=sl.cx*S, cy=sl.cy*H, hw=sl.w*S/2, hh=sl.h*S/2;
    const ang=-(sl.rot||0)*Math.PI/180;
    const dx=x-cx, dy=y-cy;
    const lx=dx*Math.cos(ang)-dy*Math.sin(ang);
    const ly=dx*Math.sin(ang)+dy*Math.cos(ang);
    if(Math.abs(lx)<=hw && Math.abs(ly)<=hh) return i;
  }
  // Regular slots
  for (let i=0; i<hitSrc.length; i++) {
    const sl=hitSrc[i];
    if(isOv(sl)) continue;
    if(x>=sl.x*S && x<(sl.x+sl.w)*S && y>=sl.y*H && y<(sl.y+sl.h)*H) return i;
  }
  return -1;
}

// ── Events ────────────────────────────────────────────
let drag=null, pinch=null, tapInfo=null, swapStartSlot=-1, swapOverSlot=-1;

function bindEvents() {
  const cvs = document.getElementById('editor-canvas');
  const fi  = document.getElementById('file-input');

  fi.addEventListener('change', e => {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    // Fill from activeSlot onwards through all empty slots
    const allIdxs = curTpl.slots.map((_,i)=>i);
    const start = activeSlot >= 0 ? activeSlot : 0;
    const ordered = [...allIdxs.slice(start), ...allIdxs.slice(0, start)];
    const targets = ordered.filter(i => !slotPhotos[i]);
    const toLoad = files.slice(0, targets.length || 1);
    toLoad.forEach((f, idx) => {
      const si = targets[idx] ?? activeSlot;
      if (si < 0) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => { slotPhotos[si]={img,ox:0,oy:0,scale:1}; renderEditor(); };
        img.onerror = () => showToast('圖片載入失敗，請重試');
        img.src = ev.target.result;
      };
      reader.readAsDataURL(f);
    });
    fi.value = '';
    showToast(files.length > 1 ? `已加入 ${toLoad.length} 張照片` : '照片已加入 · 拖曳調整');
  });

  cvs.addEventListener('touchstart', e => {
    e.preventDefault();
    hideUpdateBtn();
    if (e.touches.length===1) {
      const pt=getXY(cvs,e.touches[0]);
      // Check text resize/rotation handles first (when a text is active)
      if (activeTextId) {
        const activeTl=textLayers.find(t=>t.id===activeTextId);
        if (activeTl) {
          const handle=hitHandle(pt.x,pt.y,activeTl);
          if (handle) {
            drag=null; pinch=null; tapInfo=null; swapStartSlot=-1; swapOverSlot=-1; textDrag=null;
            if (handle==='rot') {
              textHandleDrag={type:'rotate',id:activeTl.id,initAngle:Math.atan2(pt.y-activeTl.y,pt.x-activeTl.x),initRot:activeTl.rot||0};
            } else {
              const d0=Math.sqrt((pt.x-activeTl.x)**2+(pt.y-activeTl.y)**2);
              textHandleDrag={type:'resize',id:activeTl.id,d0:Math.max(d0,5),initFsz:activeTl.fontSize};
            }
            return;
          }
        }
      }
      drag=null; pinch=null; tapInfo=null; swapStartSlot=-1; swapOverSlot=-1; textDrag=null; textHandleDrag=null;
      // Check text layers first
      const ti=hitTextLayer(pt.x,pt.y);
      if(ti>=0) {
        const tl=textLayers[ti];
        activeTextId=tl.id; activeSlot=-1; renderEditor();
        tapInfo={isText:true,id:tl.id,x:pt.x,y:pt.y};
        textDrag={id:tl.id,x:pt.x,y:pt.y,ox:tl.x,oy:tl.y};
        return;
      }
      activeTextId=null;
      const si=hitSlot(pt.x,pt.y);
      if(si<0) return;
      activeSlot=si; renderEditor();
      tapInfo={si,x:pt.x,y:pt.y};
      if(slotPhotos[si]) {
        drag={x:pt.x,y:pt.y,ox:slotPhotos[si].ox,oy:slotPhotos[si].oy};
        swapStartSlot=si;
      }
    } else if (e.touches.length===2) {
      tapInfo=null; drag=null; textHandleDrag=null;
      const d0=pDist(e.touches);
      const hasPhoto=activeSlot>=0&&slotPhotos[activeSlot];
      pinch = hasPhoto ? {mode:'photo',d0,s0:slotPhotos[activeSlot].scale}
                       : {mode:'view',d0,vs0:viewScale};
    }
  },{passive:false});

  cvs.addEventListener('touchmove', e => {
    e.preventDefault();
    if(textHandleDrag&&e.touches.length===1) {
      const pt=getXY(cvs,e.touches[0]);
      const tl=textLayers.find(t=>t.id===textHandleDrag.id);
      if(tl) {
        if(textHandleDrag.type==='resize') {
          const d=Math.sqrt((pt.x-tl.x)**2+(pt.y-tl.y)**2);
          tl.fontSize=Math.max(12,Math.min(250,textHandleDrag.initFsz*d/textHandleDrag.d0));
        } else if(textHandleDrag.type==='rotate') {
          const angle=Math.atan2(pt.y-tl.y,pt.x-tl.x);
          tl.rot=textHandleDrag.initRot+(angle-textHandleDrag.initAngle);
        }
        renderEditor();
      }
      return;
    }
    if(textDrag&&e.touches.length===1) {
      const pt=getXY(cvs,e.touches[0]);
      if(tapInfo){const dx=pt.x-tapInfo.x,dy=pt.y-tapInfo.y;if(Math.sqrt(dx*dx+dy*dy)>6)tapInfo=null;}
      const tl=textLayers.find(t=>t.id===textDrag.id);
      if(tl){tl.x=textDrag.ox+(pt.x-textDrag.x);tl.y=textDrag.oy+(pt.y-textDrag.y);renderEditor();}
      return;
    }
    if(pinch&&e.touches.length===2) {
      const d=pDist(e.touches);
      if(pinch.mode==='photo'&&activeSlot>=0&&slotPhotos[activeSlot]) {
        slotPhotos[activeSlot].scale=Math.max(.2,Math.min(8,pinch.s0*d/pinch.d0));
        renderEditor();
      } else if(pinch.mode==='view') {
        viewScale=Math.max(.15,Math.min(3,pinch.vs0*d/pinch.d0));
        applyViewScale();
      }
    } else if(drag&&e.touches.length===1&&activeSlot>=0&&slotPhotos[activeSlot]) {
      const pt=getXY(cvs,e.touches[0]);
      if(tapInfo) {
        const dx=pt.x-tapInfo.x,dy=pt.y-tapInfo.y;
        if(Math.sqrt(dx*dx+dy*dy)>6) tapInfo=null;
      }
      // Track which slot we're hovering over for swap
      const hoverSi=hitSlot(pt.x,pt.y);
      swapOverSlot=(swapStartSlot>=0&&hoverSi>=0&&hoverSi!==swapStartSlot)?hoverSi:-1;
      // Only pan photo if not hovering over a swap target
      if(swapOverSlot<0) {
        slotPhotos[activeSlot].ox=drag.ox+(pt.x-drag.x);
        slotPhotos[activeSlot].oy=drag.oy+(pt.y-drag.y);
      }
      renderEditor();
    }
  },{passive:false});

  cvs.addEventListener('touchend', e => {
    if(textHandleDrag){ textHandleDrag=null; return; }
    if(e.touches.length<2) pinch=null;
    if(e.touches.length===0) {
      if(tapInfo!==null && tapInfo.isText) {
        showTextBtn(tapInfo.id);
      } else if(tapInfo!==null) {
        if(!slotPhotos[tapInfo.si]) { fi.click(); }
        else { showUpdateBtn(tapInfo.si); }
      } else if(drag!==null && swapStartSlot>=0) {
        // Drag ended — check if released on a different slot → swap
        const t=e.changedTouches[0];
        const pt=getXY(cvs,t);
        const endSlot=hitSlot(pt.x,pt.y);
        if(endSlot>=0 && endSlot!==swapStartSlot) {
          const tmp=slotPhotos[swapStartSlot];
          slotPhotos[swapStartSlot]=slotPhotos[endSlot]||null;
          slotPhotos[endSlot]=tmp;
          showToast('照片已換位置');
        }
      }
      drag=null; tapInfo=null; swapStartSlot=-1; swapOverSlot=-1; textDrag=null;
      renderEditor();
    }
  });

  cvs.addEventListener('mousedown', e => {
    const pt=getXY(cvs,e);
    const si=hitSlot(pt.x,pt.y);
    if(si<0) return;
    activeSlot=si; renderEditor();
    if(!slotPhotos[si]) fi.click();
    else drag={x:pt.x,y:pt.y,ox:slotPhotos[si].ox,oy:slotPhotos[si].oy};
  });
  cvs.addEventListener('mousemove', e => {
    if(!drag||activeSlot<0||!slotPhotos[activeSlot]) return;
    const pt=getXY(cvs,e);
    slotPhotos[activeSlot].ox=drag.ox+(pt.x-drag.x);
    slotPhotos[activeSlot].oy=drag.oy+(pt.y-drag.y);
    renderEditor();
  });
  cvs.addEventListener('mouseup',()=>drag=null);
  cvs.addEventListener('wheel', e => {
    e.preventDefault();
    const f=e.deltaY>0?.92:1.08;
    if(e.ctrlKey||e.metaKey||!(activeSlot>=0&&slotPhotos[activeSlot])) {
      viewScale=Math.max(.15,Math.min(3,viewScale*f)); applyViewScale();
    } else {
      slotPhotos[activeSlot].scale=Math.max(.2,Math.min(8,slotPhotos[activeSlot].scale*f));
      renderEditor();
    }
  },{passive:false});
}

function getXY(cvs,e) {
  const r=cvs.getBoundingClientRect(), sc=cvs.width/r.width;
  return {x:(e.clientX-r.left)*sc, y:(e.clientY-r.top)*sc};
}
function pDist(t) {
  const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}

// ── Text editing ──────────────────────────────────────
function openTextPanel(id) {
  textEditingId = id;
  const ti = document.getElementById('text-input');
  if (id !== null) {
    const tl = textLayers.find(t => t.id === id);
    if (tl) {
      ti.value = tl.text;
      curTSz=tl.fontSize; curTColor=tl.color; curTFont=tl.fontFam||'sans'; curTBgShape=tl.bgShape||'none'; curTBgColor=tl.bgColor||'#000000'; curTShadow=tl.shadow||'none'; curTShadowColor=tl.shadowColor||'#000000';
      document.querySelectorAll('.tsz-btn').forEach(b => b.classList.toggle('sel', +b.dataset.sz===curTSz));
      document.querySelectorAll('.tclr-sw').forEach(b => b.classList.toggle('sel', b.dataset.c===curTColor));
      document.querySelectorAll('.tfont-btn').forEach(b => b.classList.toggle('sel', b.dataset.f===curTFont));
      document.querySelectorAll('.tshp-btn').forEach(b => b.classList.toggle('sel', b.dataset.sh===curTBgShape));
      document.querySelectorAll('.tbgc-sw').forEach(b => b.classList.toggle('sel', b.dataset.bc===curTBgColor));
      document.querySelectorAll('.tshd-btn').forEach(b => b.classList.toggle('sel', b.dataset.sh===curTShadow));
      document.querySelectorAll('#tshd-color-row .tclr-sw').forEach(b => b.classList.toggle('sel', b.dataset.c===curTShadowColor));
      document.getElementById('tbg-color-row').classList.toggle('show', curTBgShape!=='none');
      document.getElementById('tshd-color-row').style.display = curTShadow!=='none' ? 'flex' : 'none';
      document.getElementById('tpanel-confirm').textContent = '更新';
    }
  } else {
    ti.value = '';
    document.getElementById('tpanel-confirm').textContent = '加入';
  }
  document.getElementById('text-panel').classList.add('show');
  updatePreview();
  setTimeout(() => ti.focus(), 120);
}

function closeTextPanel() {
  previewText = null;
  document.getElementById('text-panel').classList.remove('show');
  document.getElementById('text-input').blur();
  textEditingId = null;
  renderEditor();
}

function updatePreview() {
  const rawText = document.getElementById('text-input').value;
  const text = rawText || '文字預覽';
  let px, py;
  if (textEditingId !== null) {
    const tl = textLayers.find(t => t.id === textEditingId);
    px = tl ? tl.x : curTpl.slides * LOGICAL_S / 2;
    py = tl ? tl.y : Math.round(LOGICAL_S * (curTpl.aspect || 1)) / 2;
  } else {
    px = curTpl.slides * LOGICAL_S / 2;
    py = Math.round(LOGICAL_S * (curTpl.aspect || 1)) / 2;
  }
  previewText = { text, x:px, y:py, fontSize:curTSz, color:curTColor, fontFam:curTFont, bgShape:curTBgShape, bgColor:curTBgColor, shadow:curTShadow, shadowColor:curTShadowColor };
  renderEditor();
}

function selectTShadowColorPicker(inp) {

}
function selectTBgColor(el) {
  document.querySelectorAll('.tbgc-sw').forEach(b => b.classList.remove('sel'));
  el.classList.add('sel'); curTBgColor = el.dataset.bc; updatePreview();
}
function selectTBgColorPicker(inp) {
  document.getElementById('tbgc-custom-wrap').style.background = inp.value;
  document.querySelectorAll('.tbgc-sw').forEach(b => b.classList.remove('sel'));
  curTBgColor = inp.value; updatePreview();
}

function confirmTextEdit() {
  const text = document.getElementById('text-input').value.trim();
  if (!text) { closeTextPanel(); return; }
  if (textEditingId !== null) {
    const tl = textLayers.find(t => t.id === textEditingId);
    if (tl) { tl.text=text; tl.fontSize=curTSz; tl.color=curTColor; tl.fontFam=curTFont; tl.bgShape=curTBgShape; tl.bgColor=curTBgColor; tl.shadow=curTShadow; tl.shadowColor=curTShadowColor; }
  } else {
    // Place at canvas center (reliable cross-template)
    const cx = curTpl.slides * LOGICAL_S / 2;
    const cy = Math.round(LOGICAL_S * (curTpl.aspect || 1)) / 2;
    textLayers.push({ id:Date.now(), text, x:cx, y:cy, fontSize:curTSz, color:curTColor, fontFam:curTFont, bgShape:curTBgShape, bgColor:curTBgColor, shadow:curTShadow, shadowColor:curTShadowColor, rot:0 });
  }
  closeTextPanel();
  activeTextId = null;
  renderEditor();
}

function deleteActiveText() {
  textLayers = textLayers.filter(t => t.id !== activeTextId);
  activeTextId = null; hideUpdateBtn(); renderEditor();
}

function showTextBtn(id) {
  activeTextId = id;
  const tl = textLayers.find(t => t.id === id);
  if (!tl) return;
  const cvs = document.getElementById('editor-canvas');
  const rect = cvs.getBoundingClientRect();
  const btn = document.getElementById('update-btn');
  btn.innerHTML = `<button onclick="openTextPanel(activeTextId)">編輯文字</button><button onclick="deleteActiveText()">刪除</button><button class="ubtn-cancel" onclick="hideUpdateBtn()">取消</button>`;
  btn.style.left = (rect.left + tl.x * viewScale) + 'px';
  btn.style.top  = (rect.top  + tl.y * viewScale) + 'px';
  btn.classList.add('show');
}

const FONT_FAMILIES = {
  sans:  `-apple-system,'PingFang TC','Noto Sans TC',sans-serif`,
  serif: `'Noto Serif TC','Songti TC',Georgia,serif`,
  round: `'Noto Sans TC','PingFang TC',sans-serif`,
};

function hexAlpha(hex, a) {
  const h=hex&&hex.length===7?hex:'#000000';
  const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// Draw text layer onto ctx; tx/ty are already in canvas coordinates
function drawTextOnCtx(ctx, text, tx, ty, fontSize, color, bgShape, bgColor, fontFam, shadow, rot, shadowColor) {
  ctx.save();
  if (rot) { ctx.translate(tx, ty); ctx.rotate(rot); ctx.translate(-tx, -ty); }
  if (shadow === 'light') { ctx.shadowColor=hexAlpha(shadowColor,.6); ctx.shadowBlur=fontSize*0.35; ctx.shadowOffsetX=1; ctx.shadowOffsetY=2; }
  else if (shadow === 'deep') { ctx.shadowColor=hexAlpha(shadowColor,.9); ctx.shadowBlur=fontSize*0.75; ctx.shadowOffsetX=2; ctx.shadowOffsetY=4; }
  const fam = FONT_FAMILIES[fontFam] || FONT_FAMILIES.sans;
  ctx.font = `700 ${fontSize}px ${fam}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lines = text.split('\n');
  const lineH = fontSize * 1.3;
  const totalH = lines.length * lineH;
  const maxW = Math.max(...lines.map(l => ctx.measureText(l).width));
  const pad = fontSize * 0.3;

  if (bgShape && bgShape !== 'none' && bgColor) {
    ctx.fillStyle = bgColor;
    ctx.save(); ctx.beginPath();
    const bx=tx-maxW/2-pad, by=ty-totalH/2-pad, bw=maxW+pad*2, bh=totalH+pad*2;
    if (bgShape === 'circle') {
      ctx.arc(tx, ty, Math.max(bw,bh)/2, 0, Math.PI*2);
    } else if (bgShape === 'ellipse') {
      ctx.ellipse(tx, ty, bw/2, bh/2, 0, 0, Math.PI*2);
    } else if (bgShape === 'rect') {
      ctx.rect(bx, by, bw, bh);
    } else if (bgShape === 'square') {
      const s=Math.max(bw,bh); ctx.rect(tx-s/2, ty-s/2, s, s);
    } else if (bgShape === 'capsule') {
      const r=bh/2;
      if (ctx.roundRect) ctx.roundRect(bx,by,bw,bh,r); else ctx.rect(bx,by,bw,bh);
    } else { // roundrect default
      const r=Math.min(bw,bh)*0.22;
      if (ctx.roundRect) ctx.roundRect(bx,by,bw,bh,r); else ctx.rect(bx,by,bw,bh);
    }
    ctx.fill(); ctx.restore();
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
  }
  ctx.fillStyle = color;
  lines.forEach((line, i) => ctx.fillText(line, tx, ty - totalH/2 + lineH*(i+0.5)));
  ctx.restore();
}

// Bounding box of a text layer in logical canvas coords
function textBBox(ctx, tl) {
  const fam = FONT_FAMILIES[tl.fontFam] || FONT_FAMILIES.sans;
  ctx.font = `700 ${tl.fontSize}px ${fam}`;
  const lines = tl.text.split('\n');
  const lineH = tl.fontSize * 1.3;
  const totalH = lines.length * lineH;
  const maxW = Math.max(...lines.map(l => ctx.measureText(l).width));
  const pad = tl.fontSize * 0.28;
  return { x: tl.x - maxW/2 - pad, y: tl.y - totalH/2 - pad, w: maxW+pad*2, h: totalH+pad*2 };
}

function drawTextHandles(ctx, tl) {
  const bb = textBBox(ctx, tl);
  const HS = 14;
  ctx.strokeStyle = '#0095f6'; ctx.lineWidth = 2;
  ctx.strokeRect(bb.x-1, bb.y-1, bb.w+2, bb.h+2);
  const corners = [[bb.x-1,bb.y-1],[bb.x+bb.w-HS+1,bb.y-1],[bb.x-1,bb.y+bb.h-HS+1],[bb.x+bb.w-HS+1,bb.y+bb.h-HS+1]];
  ctx.fillStyle='#fff'; ctx.lineWidth=1.5;
  corners.forEach(([cx,cy])=>{ ctx.fillRect(cx,cy,HS,HS); ctx.strokeRect(cx,cy,HS,HS); });
  const rx=bb.x+bb.w/2, ry=bb.y-26;
  ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(bb.x+bb.w/2,bb.y-1); ctx.lineTo(rx,ry+10); ctx.stroke();
  ctx.beginPath(); ctx.arc(rx,ry,10,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#0095f6'; ctx.stroke();
  ctx.fillStyle='#0095f6'; ctx.font='13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('↻',rx,ry+1);
}

function hitHandle(x, y, tl) {
  const cvs=document.getElementById('editor-canvas');
  const ctx=cvs.getContext('2d');
  const bb=textBBox(ctx,tl);
  const HS=14;
  const corners=[{tag:'tl',cx:bb.x-1,cy:bb.y-1},{tag:'tr',cx:bb.x+bb.w-HS+1,cy:bb.y-1},{tag:'bl',cx:bb.x-1,cy:bb.y+bb.h-HS+1},{tag:'br',cx:bb.x+bb.w-HS+1,cy:bb.y+bb.h-HS+1}];
  for(const c of corners){ if(x>=c.cx&&x<=c.cx+HS&&y>=c.cy&&y<=c.cy+HS) return c.tag; }
  const rx=bb.x+bb.w/2, ry=bb.y-26;
  if(Math.sqrt((x-rx)**2+(y-ry)**2)<=12) return 'rot';
  return null;
}

function hitTextLayer(x, y) {
  const cvs = document.getElementById('editor-canvas');
  const ctx = cvs.getContext('2d');
  for (let i = textLayers.length - 1; i >= 0; i--) {
    const bb = textBBox(ctx, textLayers[i]);
    if (x >= bb.x && x <= bb.x+bb.w && y >= bb.y && y <= bb.y+bb.h) return i;
  }
  return -1;
}

// ── Export ────────────────────────────────────────────
async function saveAll() {
  const tpl=curTpl;
  if(!slotPhotos.some(p=>p&&p.img)){showToast('請先加入至少一張照片');return;}
  showToast(`正在產生 ${tpl.slides} 張圖片...`);

  const EP = tpl.exportW || EXPORT_PX;
  const EPH = tpl.exportH || Math.round(EP*(tpl.aspect||1));
  const ratio=EP/LOGICAL_S;
  const container=document.getElementById('export-imgs');
  container.innerHTML='';

  for(let si=0;si<tpl.slides;si++){
    const off=document.createElement('canvas');
    off.width=EP; off.height=EPH;
    const ctx=off.getContext('2d');
    ctx.fillStyle=tpl.bg||(tpl.blackBg?'#000':'#111'); ctx.fillRect(0,0,EP,EPH);

    // Pass 1: regular slots (x/w in slide-width units; y/h in slide-height units)
    tpl.slots.forEach((sl,i)=>{
      if(isOv(sl)) return;
      const slotX=sl.x*EP, slotY=sl.y*EPH, slotW=sl.w*EP, slotH=sl.h*EPH;
      const slideL=si*EP;
      const oL=Math.max(slotX,slideL), oR=Math.min(slotX+slotW,slideL+EP);
      if(oL>=oR) return;
      const clipX=oL-slideL, clipW=oR-oL;
      ctx.save();
      ctx.beginPath(); ctx.rect(clipX,slotY,clipW,slotH); ctx.clip();
      const ph=slotPhotos[i];
      if(ph&&ph.img){
        const img=ph.img;
        const AR=img.naturalWidth/img.naturalHeight, sAR=slotW/slotH;
        let dw,dh;
        if(AR>sAR){dh=slotH*ph.scale;dw=dh*AR;}else{dw=slotW*ph.scale;dh=dw/AR;}
        const ox=ph.ox*ratio, oy=ph.oy*ratio;
        ctx.drawImage(img, slotX-slideL+(slotW-dw)/2+ox, slotY+(slotH-dh)/2+oy, dw, dh);
      } else {
        ctx.fillStyle='#1d1d1d'; ctx.fillRect(clipX,slotY,clipW,slotH);
      }
      ctx.restore();
    });

    // Pass 2: overlay slots (cx in width units, cy in height units)
    tpl.slots.forEach((sl,i)=>{
      if(!isOv(sl)) return;
      const cx=(sl.cx-si)*EP, cy=sl.cy*EPH;
      const w=sl.w*EP, h=sl.h*EP;
      const rot=(sl.rot||0)*Math.PI/180;
      const fw=sl.frame ? Math.round(2*EP/LOGICAL_S) : 0;
      const ph=slotPhotos[i];
      if(!ph||!ph.img) return;

      ctx.save();
      ctx.translate(cx,cy); ctx.rotate(rot);

      if(sl.shadow){
        ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=28; ctx.shadowOffsetX=6; ctx.shadowOffsetY=8;
      }
      if(fw>0){
        ctx.fillStyle='#f0f0f0'; ctx.fillRect(-w/2,-h/2,w,h);
        ctx.shadowColor='transparent'; ctx.shadowBlur=0;
      }
      const iw=w-fw*2, ih=h-fw*2;
      ctx.save();
      ctx.beginPath(); ctx.rect(-iw/2,-ih/2,iw,ih); ctx.clip();
      if(ph&&ph.img){
        const img=ph.img;
        const AR=img.naturalWidth/img.naturalHeight, sAR=iw/ih;
        let dw,dh;
        if(AR>sAR){dh=ih*ph.scale;dw=dh*AR;}else{dw=iw*ph.scale;dh=dw/AR;}
        const ox=ph.ox*ratio, oy=ph.oy*ratio;
        ctx.drawImage(img, -(dw/2)+ox, -(dh/2)+oy, dw, dh);
      } else {
        ctx.fillStyle='#2a2a2a'; ctx.fillRect(-iw/2,-ih/2,iw,ih);
      }
      ctx.restore(); ctx.restore();
    });

    // Pass 3: text layers for this slide
    const scl = EP / LOGICAL_S;
    textLayers.forEach(tl => {
      // Only draw if text center is within this slide's x range
      if (tl.x < si*LOGICAL_S || tl.x >= (si+1)*LOGICAL_S) return;
      const tx = (tl.x - si*LOGICAL_S) * scl;
      const ty = tl.y * scl;
      drawTextOnCtx(ctx, tl.text, tx, ty, tl.fontSize*scl, tl.color, tl.bgShape||'none', tl.bgColor||'#000', tl.fontFam||'sans', tl.shadow||'none', tl.rot||0, tl.shadowColor||'#000000');
    });

    const item=document.createElement('div');
    item.className='export-item';
    const imgEl=document.createElement('img');
    imgEl.src=off.toDataURL('image/png');
    imgEl.alt=`第 ${si+1} 格`;
    const label=document.createElement('div');
    label.className='export-label';
    label.textContent=`第 ${si+1} 格（共 ${tpl.slides} 格）`;
    item.appendChild(imgEl); item.appendChild(label);
    container.appendChild(item);
    off.width=off.height=0;  // free iOS canvas memory
  }
  document.getElementById('export-overlay').classList.add('show');
}

function closeExport(){
  document.getElementById('export-overlay').classList.remove('show');
}

// ── Toast ─────────────────────────────────────────────
let toastT;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),3000);
}

// Prevent iOS Safari pinch-zoom from interfering with editor
document.addEventListener('gesturestart',  e => e.preventDefault(), {passive:false});
document.addEventListener('gesturechange', e => e.preventDefault(), {passive:false});

// Preload sample photos, then build gallery (fallback to gradients if load fails)
goTo('gallery');
let loadedCount = 0;
SAMPLE_URLS.forEach((url, i) => {
  const img = new Image();
  img.onload = () => {
    sampleImgs[i] = img;
    loadedCount++;
    if (loadedCount === SAMPLE_URLS.length) buildGallery();
  };
  img.onerror = () => {
    loadedCount++;
    if (loadedCount === SAMPLE_URLS.length) buildGallery();
  };
  img.src = url;
});
